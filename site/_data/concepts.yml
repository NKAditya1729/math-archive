---
- letter: A
  name: Arbitrary union axiom (T3)
  gloss: Axiom (T3) asserts that any family $\{U_i\}_{i \in I} \subseteq \tau$ has
    $\bigcup_{i \in I} U_i \in \tau$, with no size restriction on $I$.
  course: point-set-topology
  course_title: Point-Set Topology
  lecture: 1
  symbol: "$\\bigcup_{i \\in I} U_i \\in \\tau$"
  anchor: definition-1-1-topology-topological-space
- letter: A
  name: Axioms of a topology
  gloss: 'The three defining conditions: (T1) endpoints $\varnothing, X \in \tau$,
    (T2) closure under finite intersections, (T3) closure under arbitrary unions.'
  course: point-set-topology
  course_title: Point-Set Topology
  lecture: 1
  symbol: "(T1), (T2), (T3)"
  anchor: definition-1-1-topology-topological-space
- letter: B
  name: Basis for a topology
  gloss: A subcollection $\mathcal{B} \subseteq \tau$ such that every open set is
    a union of members of $\mathcal{B}$.
  course: point-set-topology
  course_title: Point-Set Topology
  lecture: 3
  anchor: "definition-3-6-basis-for-a-topology"
  symbol: "$\\mathcal{B}, \\mathcal{B}_n$"
- letter: B
  name: Basis criterion for continuity
  gloss: 'A map $f : X \to Y$ is continuous if and only if preimages $f^{-1}(B)$ of basic open sets $B \in \mathcal{B}_Y$ are open in $X$.'
  course: point-set-topology
  course_title: Point-Set Topology
  lecture: 8
  anchor: "lemma-8-1-basis-criterion-for-continuity"
- letter: B
  name: Bounded subset
  gloss: A subset of $\mathbb{R}^n$ contained within some open ball around the origin.
  course: point-set-topology
  course_title: Point-Set Topology
  lecture: 25
- letter: B
  name: Box topology
  gloss: Topology on arbitrary products generated by product open boxes $\prod U_i$
    with no finiteness restriction; strictly finer than product topology.
  course: point-set-topology
  course_title: Point-Set Topology
  lecture: 6
  anchor: "definition-6-1-the-box-topology"
- letter: C
  name: Closed set
  gloss: A subset $A \subseteq X$ whose complement $X \setminus A$ is an open set
