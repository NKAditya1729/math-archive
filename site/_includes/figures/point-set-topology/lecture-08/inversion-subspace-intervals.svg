<svg viewBox="0 0 680 250" role="img" aria-labelledby="fig-inv-title"
     xmlns="http://www.w3.org/2000/svg" class="fig">
  <title id="fig-inv-title">Continuity of inversion on R^x: pullback of interval B_epsilon(x) avoids 0 and is open in the subspace topology.</title>
  <defs>
    <marker id="arrow-inv" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="var(--ink)" />
    </marker>
    <marker id="arrow-curve" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="var(--accent)" />
    </marker>
  </defs>

  <!-- TOP LINE: Target interval B_eps(x) -->
  <text x="340" y="26" class="fig-label" text-anchor="middle">Target interval B_ε(x) in ℝ^×</text>

  <!-- Real line -->
  <line x1="50" y1="65" x2="630" y2="65" class="fig-axis" marker-end="url(#arrow-inv)" />
  <text x="640" y="69" class="fig-tick">ℝ</text>

  <!-- Origin 0 (punctured) -->
  <circle cx="150" cy="65" r="4.5" fill="var(--paper)" stroke="var(--flag)" stroke-width="2" />
  <text x="150" y="85" class="fig-fail" text-anchor="middle">0 ∉ ℝ^×</text>

  <!-- Interval (x - eps, x + eps) (Focal) -->
  <rect x="350" y="53" width="140" height="24" rx="3" class="fig-region" />
  
  <!-- Center point x -->
  <circle cx="420" cy="65" r="3.5" fill="var(--ink)" />
  <text x="420" y="46" class="fig-focus" text-anchor="middle">x</text>

  <!-- Endpoints -->
  <text x="350" y="86" class="fig-tick" text-anchor="middle">x − ε</text>
  <text x="490" y="86" class="fig-tick" text-anchor="middle">x + ε</text>

  <!-- MAPPING INVERSION ARROW -->
  <path d="M 420 95 Q 435 125 360 145" fill="none" stroke="var(--accent)" stroke-width="1.8" marker-end="url(#arrow-curve)" />
  <text x="445" y="125" class="fig-label">t ↦ 1/t</text>

  <!-- BOTTOM LINE: Preimage interval f^{-1}(B_eps(x)) -->
  <line x1="50" y1="180" x2="630" y2="180" class="fig-axis" marker-end="url(#arrow-inv)" />
  <text x="640" y="184" class="fig-tick">ℝ</text>

  <!-- Origin 0 (punctured) -->
  <circle cx="150" cy="180" r="4.5" fill="var(--paper)" stroke="var(--flag)" stroke-width="2" />
  <text x="150" y="200" class="fig-fail" text-anchor="middle">0 ∉ ℝ^×</text>

  <!-- Preimage interval -->
  <rect x="270" y="168" width="100" height="24" rx="3" class="fig-region" />
  
  <!-- Center point 1/x -->
  <circle cx="310" cy="180" r="3.5" fill="var(--ink)" />
  <text x="310" y="162" class="fig-label" text-anchor="middle">1/x</text>

  <!-- Endpoints -->
  <text x="270" y="205" class="fig-tick" text-anchor="middle">1/(x + ε)</text>
  <text x="370" y="205" class="fig-tick" text-anchor="middle">1/(x − ε)</text>
</svg>
