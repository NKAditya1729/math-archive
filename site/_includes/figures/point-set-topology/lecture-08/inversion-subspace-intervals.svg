<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 250" width="100%" height="auto" style="background:#fcfbf9;">
  <defs>
    <marker id="arrow-inv" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#766e65"/>
    </marker>
    <marker id="arrow-curve" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2b5c8f"/>
    </marker>
  </defs>

  <!-- TOP LINE: Target interval B_eps(x) -->
  <g id="top-line">
    <text x="340" y="26" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#1a1a1a">Target Interval B_ε(x) in ℝ^×</text>

    <!-- Real line -->
    <line x1="50" y1="65" x2="630" y2="65" stroke="#b0a89f" stroke-width="1.5" marker-end="url(#arrow-inv)"/>
    <text x="640" y="69" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#766e65">ℝ</text>

    <!-- Origin 0 (punctured) -->
    <circle cx="150" cy="65" r="4.5" fill="#fcfbf9" stroke="#8b3a2b" stroke-width="2"/>
    <text x="150" y="85" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#8b3a2b" text-anchor="middle" font-weight="600">0 ∉ ℝ^×</text>

    <!-- Interval (x - eps, x + eps) with eps < x -->
    <!-- x at 420. eps = 70 => [350, 490]. Notice 350 > 150 (strictly right of 0) -->
    <rect x="350" y="53" width="140" height="24" rx="3" fill="rgba(43, 92, 143, 0.15)" stroke="#2b5c8f" stroke-width="1.5"/>
    
    <!-- Center point x -->
    <circle cx="420" cy="65" r="3.5" fill="#2b5c8f"/>
    <text x="420" y="46" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#2b5c8f" text-anchor="middle">x</text>

    <!-- Endpoints -->
    <text x="350" y="69" font-family="system-ui, -apple-system, sans-serif" font-size="15" fill="#2b5c8f" text-anchor="middle">(</text>
    <text x="490" y="69" font-family="system-ui, -apple-system, sans-serif" font-size="15" fill="#2b5c8f" text-anchor="middle">)</text>
    <text x="350" y="86" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#2b5c8f" text-anchor="middle">x − ε</text>
    <text x="490" y="86" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#2b5c8f" text-anchor="middle">x + ε</text>

    <!-- Condition eps < |x| arrow indicator -->
    <line x1="156" y1="65" x2="348" y2="65" stroke="#8b3a2b" stroke-width="1" stroke-dasharray="2,2"/>
    <text x="250" y="56" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#8b3a2b" text-anchor="middle">gap &gt; 0 (since ε &lt; |x|)</text>
  </g>

  <!-- MAPPING INVERSION ARROW -->
  <g id="inversion-map">
    <path d="M 420 95 Q 435 125 360 145" fill="none" stroke="#2b5c8f" stroke-width="1.8" marker-end="url(#arrow-curve)"/>
    <text x="445" y="125" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#2b5c8f">f⁻¹ : t ↦ 1/t</text>
  </g>

  <!-- BOTTOM LINE: Preimage interval f^{-1}(B_eps(x)) -->
  <g id="bottom-line">
    <!-- Real line -->
    <line x1="50" y1="180" x2="630" y2="180" stroke="#b0a89f" stroke-width="1.5" marker-end="url(#arrow-inv)"/>
    <text x="640" y="184" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#766e65">ℝ</text>

    <!-- Origin 0 (punctured) -->
    <circle cx="150" cy="180" r="4.5" fill="#fcfbf9" stroke="#8b3a2b" stroke-width="2"/>
    <text x="150" y="200" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#8b3a2b" text-anchor="middle" font-weight="600">0 ∉ ℝ^×</text>

    <!-- Preimage interval: 1/(x+eps) to 1/(x-eps). Both > 0.
         x+eps > x-eps > 0 => 1/(x+eps) < 1/(x-eps).
         Let's place 1/(x+eps) at 270, 1/x at 310, 1/(x-eps) at 370 -->
    <rect x="270" y="168" width="100" height="24" rx="3" fill="rgba(59, 122, 87, 0.15)" stroke="#3b7a57" stroke-width="1.5"/>
    
    <!-- Center point 1/x -->
    <circle cx="310" cy="180" r="3.5" fill="#3b7a57"/>
    <text x="310" y="162" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#3b7a57" text-anchor="middle">1/x</text>

    <!-- Endpoints -->
    <text x="270" y="184" font-family="system-ui, -apple-system, sans-serif" font-size="15" fill="#3b7a57" text-anchor="middle">(</text>
    <text x="370" y="184" font-family="system-ui, -apple-system, sans-serif" font-size="15" fill="#3b7a57" text-anchor="middle">)</text>
    <text x="270" y="205" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#3b7a57" text-anchor="middle">1/(x + ε)</text>
    <text x="370" y="205" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#3b7a57" text-anchor="middle">1/(x − ε)</text>

    <!-- Label -->
    <text x="320" y="235" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" fill="#3b7a57" text-anchor="middle">
      f⁻¹(B_ε(x)) = (1/(x + ε), 1/(x − ε)) ⊆ ℝ^× (open in ℝ, hence open in subspace)
    </text>
  </g>
</svg>
