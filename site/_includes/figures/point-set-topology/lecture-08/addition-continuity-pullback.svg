<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 260" width="100%" height="auto" style="background:#fcfbf9;">
  <defs>
    <!-- Arrow marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#766e65"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2b5c8f"/>
    </marker>
  </defs>

  <!-- LEFT PANEL: Domain R^2 -->
  <g id="domain-r2">
    <!-- Panel title -->
    <text x="150" y="30" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#1a1a1a">Domain ℝ²</text>

    <!-- Axes -->
    <line x1="40" y1="160" x2="260" y2="160" stroke="#b0a89f" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="100" y1="220" x2="100" y2="45" stroke="#b0a89f" stroke-width="1.2" marker-end="url(#arrow)"/>
    <text x="265" y="164" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#766e65">u</text>
    <text x="100" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#766e65" text-anchor="middle">v</text>

    <!-- Square S_{eps'/2}(x,y) -->
    <!-- Center (x,y) at (170, 110). Half-width 36 => [134, 206], [74, 146] -->
    <rect x="134" y="74" width="72" height="72" fill="rgba(43, 92, 143, 0.12)" stroke="#2b5c8f" stroke-width="1.8" stroke-dasharray="4,3"/>

    <!-- Point (x,y) -->
    <circle cx="170" cy="110" r="3.5" fill="#2b5c8f"/>
    <text x="176" y="106" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#2b5c8f">(x, y)</text>

    <!-- Coordinate dashed lines -->
    <line x1="170" y1="110" x2="170" y2="160" stroke="#b0a89f" stroke-dasharray="2,2"/>
    <line x1="170" y1="110" x2="100" y2="110" stroke="#b0a89f" stroke-dasharray="2,2"/>
    <text x="170" y="175" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#766e65" text-anchor="middle">x</text>
    <text x="90" y="114" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#766e65" text-anchor="end">y</text>

    <!-- Dimension indicator: half-side eps'/2 -->
    <line x1="170" y1="74" x2="206" y2="74" stroke="#2b5c8f" stroke-width="1.2"/>
    <line x1="170" y1="70" x2="170" y2="78" stroke="#2b5c8f" stroke-width="1.2"/>
    <line x1="206" y1="70" x2="206" y2="78" stroke="#2b5c8f" stroke-width="1.2"/>
    <text x="188" y="66" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#2b5c8f" text-anchor="middle">ε′/2</text>

    <!-- Label -->
    <text x="170" y="240" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#2b5c8f" text-anchor="middle" font-weight="500">S_{ε′/2}(x, y)</text>
  </g>

  <!-- MAPPING ARROW -->
  <g id="mapping-arrow">
    <path d="M 285 110 Q 335 90 375 110" fill="none" stroke="#2b5c8f" stroke-width="2" marker-end="url(#arrow-blue)"/>
    <text x="330" y="90" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#2b5c8f" text-anchor="middle">A(u, v) = u + v</text>
    <text x="330" y="130" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#766e65" text-anchor="middle">|Δ(u+v)| &lt; 2(ε′/2) = ε′</text>
  </g>

  <!-- RIGHT PANEL: Target R -->
  <g id="target-r">
    <!-- Panel title -->
    <text x="530" y="30" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#1a1a1a">Target ℝ</text>

    <!-- Real line -->
    <line x1="390" y1="140" x2="660" y2="140" stroke="#b0a89f" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="665" y="144" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#766e65">ℝ</text>

    <!-- Outer interval B_eps(z) = (z - eps, z + eps) -->
    <!-- z at 510. eps = 95 => [415, 605] -->
    <rect x="415" y="126" width="190" height="28" rx="4" fill="rgba(139, 58, 43, 0.08)" stroke="#8b3a2b" stroke-width="1.5" stroke-dasharray="4,3"/>
    <line x1="510" y1="134" x2="510" y2="146" stroke="#8b3a2b" stroke-width="1.8"/>
    <circle cx="510" cy="140" r="3" fill="#8b3a2b"/>
    <text x="510" y="162" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#8b3a2b" text-anchor="middle">z</text>

    <!-- Endpoint brackets for B_eps(z) -->
    <text x="415" y="144" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#8b3a2b" text-anchor="middle">(</text>
    <text x="605" y="144" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#8b3a2b" text-anchor="middle">)</text>
    <text x="415" y="162" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#8b3a2b" text-anchor="middle">z − ε</text>
    <text x="605" y="162" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#8b3a2b" text-anchor="middle">z + ε</text>

    <!-- Point x+y and inner interval B_{eps'}(x+y) -->
    <!-- x+y at 535. eps' = 42 => [493, 577] -->
    <rect x="493" y="130" width="84" height="20" rx="3" fill="rgba(43, 92, 143, 0.22)" stroke="#2b5c8f" stroke-width="1.8"/>
    <circle cx="535" cy="140" r="3.5" fill="#2b5c8f"/>
    <text x="535" y="122" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#2b5c8f" text-anchor="middle">x + y</text>

    <!-- Endpoint brackets for B_{eps'}(x+y) -->
    <text x="493" y="144" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="#2b5c8f" text-anchor="middle">(</text>
    <text x="577" y="144" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="#2b5c8f" text-anchor="middle">)</text>

    <!-- Labels for intervals -->
    <text x="535" y="185" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" fill="#2b5c8f" text-anchor="middle">B_{ε′}(x + y)</text>
    <text x="510" y="205" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#8b3a2b" text-anchor="middle">B_ε(z)</text>
    <text x="510" y="240" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#766e65" text-anchor="middle">B_{ε′}(x + y) ⊆ B_ε(z)</text>
  </g>
</svg>
