<svg viewBox="0 0 680 260" role="img" aria-labelledby="fig-add-pullback-title"
     xmlns="http://www.w3.org/2000/svg" class="fig">
  <title id="fig-add-pullback-title">Continuity of addition: pulling back a neighborhood of x+y to an open square around (x,y) in R^2.</title>
  <defs>
    <marker id="arrow-add" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="var(--ink)" />
    </marker>
    <marker id="arrow-blue-add" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="var(--accent)" />
    </marker>
  </defs>

  <!-- LEFT PANEL: Domain R^2 -->
  <text x="150" y="30" class="fig-label" text-anchor="middle">Domain ℝ²</text>

  <!-- Axes -->
  <line x1="40" y1="160" x2="260" y2="160" class="fig-axis" marker-end="url(#arrow-add)" />
  <line x1="100" y1="220" x2="100" y2="45" class="fig-axis" marker-end="url(#arrow-add)" />
  <text x="265" y="164" class="fig-tick">u</text>
  <text x="100" y="38" class="fig-tick" text-anchor="middle">v</text>

  <!-- Square S_{eps'/2}(x,y) (Focal) -->
  <rect x="134" y="74" width="72" height="72" class="fig-region" stroke-dasharray="4 3" />

  <!-- Point (x,y) -->
  <circle cx="170" cy="110" r="3.5" fill="var(--ink)" />
  <text x="176" y="106" class="fig-focus">(x, y)</text>

  <!-- Coordinate dashed lines -->
  <line x1="170" y1="110" x2="170" y2="160" class="fig-tick" stroke-dasharray="2 2" />
  <line x1="170" y1="110" x2="100" y2="110" class="fig-tick" stroke-dasharray="2 2" />
  <text x="170" y="175" class="fig-tick" text-anchor="middle">x</text>
  <text x="90" y="114" class="fig-tick" text-anchor="end">y</text>

  <!-- Dimension indicator: half-side eps'/2 -->
  <line x1="170" y1="74" x2="206" y2="74" stroke="var(--accent)" stroke-width="1.2" />
  <line x1="170" y1="70" x2="170" y2="78" stroke="var(--accent)" stroke-width="1.2" />
  <line x1="206" y1="70" x2="206" y2="78" stroke="var(--accent)" stroke-width="1.2" />
  <text x="188" y="66" class="fig-tick" text-anchor="middle">ε′/2</text>

  <text x="170" y="240" class="fig-tick" text-anchor="middle">S_{ε′/2}(x, y)</text>

  <!-- MAPPING ARROW -->
  <path d="M 285 110 Q 335 90 375 110" fill="none" stroke="var(--accent)" stroke-width="2" marker-end="url(#arrow-blue-add)" />
  <text x="330" y="90" class="fig-label" text-anchor="middle">A(u, v)</text>

  <!-- RIGHT PANEL: Target R -->
  <text x="530" y="30" class="fig-label" text-anchor="middle">Target ℝ</text>

  <!-- Real line -->
  <line x1="390" y1="140" x2="660" y2="140" class="fig-axis" marker-end="url(#arrow-add)" />
  <text x="665" y="144" class="fig-tick">ℝ</text>

  <!-- Outer interval B_eps(z) -->
  <rect x="415" y="126" width="190" height="28" rx="4" fill="var(--ink-soft)" fill-opacity="0.06" stroke="var(--ink-soft)" stroke-width="1.5" stroke-dasharray="4 3" />
  <circle cx="510" cy="140" r="3" fill="var(--ink-soft)" />
  <text x="510" y="162" class="fig-tick" text-anchor="middle">z</text>

  <!-- Point x+y and inner interval B_{eps'}(x+y) -->
  <rect x="493" y="130" width="84" height="20" rx="3" class="fig-region" />
  <circle cx="535" cy="140" r="3.5" fill="var(--ink)" />
  <text x="535" y="122" class="fig-label" text-anchor="middle">x + y</text>

  <!-- Labels for intervals -->
  <text x="535" y="185" class="fig-tick" text-anchor="middle">B_{ε′}(x + y)</text>
  <text x="510" y="205" class="fig-tick" text-anchor="middle">B_ε(z)</text>
</svg>
