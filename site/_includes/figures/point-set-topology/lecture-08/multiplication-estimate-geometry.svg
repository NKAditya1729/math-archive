<svg viewBox="0 0 680 270" role="img" aria-labelledby="fig-mult-title"
     xmlns="http://www.w3.org/2000/svg" class="fig">
  <title id="fig-mult-title">Geometric decomposition of product error and bounding by delta.</title>
  <defs>
    <marker id="arrow-m" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="var(--ink)" />
    </marker>
  </defs>

  <!-- LEFT PANEL: Geometric decomposition -->
  <text x="160" y="28" class="fig-label" text-anchor="middle">Area decomposition</text>

  <!-- Axes -->
  <line x1="40" y1="210" x2="280" y2="210" class="fig-axis" marker-end="url(#arrow-m)" />
  <line x1="50" y1="220" x2="50" y2="40" class="fig-axis" marker-end="url(#arrow-m)" />

  <!-- Base rectangle: [0, x] x [0, y] (Focal) -->
  <rect x="50" y="120" width="120" height="90" class="fig-region" />
  <text x="110" y="170" class="fig-focus" text-anchor="middle">xy</text>

  <!-- Top horizontal strip: x * (y' - y) -->
  <rect x="50" y="92" width="120" height="28" fill="var(--ink-soft)" fill-opacity="0.10" stroke="var(--ink-soft)" stroke-width="1.2" stroke-dasharray="3 2" />
  <text x="110" y="110" class="fig-tick" text-anchor="middle">x(y′ − y)</text>

  <!-- Right vertical strip: (x' - x) * y' -->
  <rect x="170" y="92" width="32" height="118" fill="var(--ink-soft)" fill-opacity="0.15" stroke="var(--ink-soft)" stroke-width="1.2" stroke-dasharray="3 2" />
  <text x="186" y="155" class="fig-tick" text-anchor="middle" transform="rotate(-90 186 155)">(x′ − x)y′</text>

  <!-- Axis tick labels -->
  <text x="50" y="225" class="fig-tick" text-anchor="middle">0</text>
  <text x="170" y="225" class="fig-tick" text-anchor="middle">x</text>
  <text x="202" y="225" class="fig-tick" text-anchor="middle">x′</text>
  <line x1="170" y1="208" x2="170" y2="214" class="fig-tick" />
  <line x1="202" y1="208" x2="202" y2="214" class="fig-tick" />

  <text x="42" y="124" class="fig-tick" text-anchor="end">y</text>
  <text x="42" y="96" class="fig-tick" text-anchor="end">y′</text>
  <line x1="48" y1="120" x2="54" y2="120" class="fig-tick" />
  <line x1="48" y1="92" x2="54" y2="92" class="fig-tick" />

  <text x="160" y="255" class="fig-caption-inline" text-anchor="middle">x′y′ − xy = (x′ − x)y′ + x(y′ − y)</text>

  <!-- DIVIDER -->
  <line x1="330" y1="30" x2="330" y2="245" class="fig-tick" stroke-dasharray="4 4" />

  <!-- RIGHT PANEL: Algebraic control -->
  <text x="490" y="28" class="fig-label" text-anchor="middle">Controlling the error</text>

  <!-- Step 1: bounds -->
  <rect x="360" y="55" width="260" height="45" rx="4" fill="var(--paper)" stroke="var(--rule)" stroke-width="1" />
  <text x="375" y="73" class="fig-caption-inline">For (x′, y′) in S_δ(x, y) with δ ≤ 1:</text>
  <text x="375" y="90" class="fig-tick">|x′ − x| &lt; δ,  |y′| ≤ |y| + 1</text>

  <!-- Step 2: bound -->
  <rect x="360" y="110" width="260" height="45" rx="4" fill="var(--paper)" stroke="var(--rule)" stroke-width="1" />
  <text x="375" y="128" class="fig-caption-inline">Triangle inequality gives:</text>
  <text x="375" y="145" class="fig-tick">|x′y′ − xy| &lt; δ(|x| + |y| + 1)</text>

  <!-- Step 3: target delta -->
  <rect x="360" y="165" width="260" height="65" rx="4" fill="var(--paper)" stroke="var(--accent)" stroke-width="1.2" />
  <text x="375" y="185" class="fig-caption-inline">To achieve error &lt; ε′:</text>
  <text x="490" y="205" class="fig-focus" text-anchor="middle">δ = ε′ / (|x| + |y| + 1)</text>
  <text x="490" y="222" class="fig-caption-inline" text-anchor="middle">M(S_δ(x, y)) ⊆ B_{ε′}(xy)</text>
</svg>
