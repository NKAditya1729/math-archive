<svg viewBox="0 0 600 340" width="100%" height="auto" role="img" aria-labelledby="f1-title f1-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="f1-title">Hasse Diagram of Topologies on a Three-Element Set</title>
  <desc id="f1-desc">A Hasse diagram showing topologies on {a,b,c} ordered by inclusion, bounded below by the trivial topology and above by the discrete topology.</desc>

  <style>
    .node-box { fill: var(--paper); stroke: var(--rule); stroke-width: 1.5; rx: 4; ry: 4; }
    .node-extreme { fill: var(--paper); stroke: var(--accent); stroke-width: 2; rx: 4; ry: 4; }
    .edge { stroke: var(--rule); stroke-width: 1.5; stroke-linecap: round; }
    .lbl { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 13px; fill: var(--ink); text-anchor: middle; dominant-baseline: central; }
    .lbl-math { font-family: "Source Serif 4", Georgia, serif; font-size: 14px; }
    .lbl-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 12px; font-weight: 600; fill: var(--ink-soft); text-anchor: middle; }
    .lbl-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 11px; fill: var(--ink-soft); text-anchor: middle; }
    .axis-arrow { stroke: var(--ink-soft); stroke-width: 1.2; marker-end: url(#arrow); }
  </style>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="var(--ink-soft)" />
    </marker>
  </defs>

  <!-- Fineness order indicator on left -->
  <line x1="42" y1="285" x2="42" y2="55" class="axis-arrow" />
  <text x="35" y="170" class="lbl-title" transform="rotate(-90 35 170)">FINER TOPOLOGY (⊇)</text>

  <!-- Lattice Edges (Inclusions) -->
  <!-- From Level 0 {∅, X} up to Level 1 -->
  <line x1="260" y1="275" x2="140" y2="225" class="edge" />
  <line x1="300" y1="275" x2="300" y2="225" class="edge" />
  <line x1="340" y1="275" x2="460" y2="225" class="edge" />

  <!-- From Level 1 to Level 2 -->
  <!-- τ_a = {∅, {a}, X} to τ_{a,b} and τ_part -->
  <line x1="140" y1="195" x2="195" y2="145" class="edge" />
  <line x1="150" y1="195" x2="385" y2="145" class="edge" />
  <!-- τ_b = {∅, {b}, X} to τ_{a,b} -->
  <line x1="285" y1="195" x2="215" y2="145" class="edge" />
  <!-- τ_{b,c} = {∅, {b,c}, X} to τ_part -->
  <line x1="460" y1="195" x2="415" y2="145" class="edge" />

  <!-- From Level 2 to Level 3 P(X) -->
  <line x1="215" y1="115" x2="280" y2="65" class="edge" />
  <line x1="385" y1="115" x2="320" y2="65" class="edge" />

  <!-- LEVEL 0: Trivial Topology (Bottom) -->
  <g transform="translate(300, 290)">
    <rect class="node-extreme" x="-95" y="-18" width="190" height="36" />
    <text class="lbl" y="-1">
      <tspan class="lbl-math">τ</tspan><tspan dy="3" font-size="10">triv</tspan><tspan dy="-3"> = { ∅, </tspan><tspan class="lbl-math">X</tspan><tspan> } (2 sets)</tspan>
    </text>
    <text class="lbl-sub" y="28">Trivial topology — coarsest</text>
  </g>

  <!-- LEVEL 1: Topologies with 3 sets -->
  <!-- Left: {∅, {a}, X} -->
  <g transform="translate(140, 210)">
    <rect class="node-box" x="-75" y="-16" width="150" height="32" />
    <text class="lbl" y="0">{ ∅, {<tspan class="lbl-math">a</tspan>}, <tspan class="lbl-math">X</tspan> }</text>
  </g>

  <!-- Middle: {∅, {b}, X} -->
  <g transform="translate(300, 210)">
    <rect class="node-box" x="-75" y="-16" width="150" height="32" />
    <text class="lbl" y="0">{ ∅, {<tspan class="lbl-math">b</tspan>}, <tspan class="lbl-math">X</tspan> }</text>
  </g>

  <!-- Right: {∅, {b,c}, X} -->
  <g transform="translate(460, 210)">
    <rect class="node-box" x="-80" y="-16" width="160" height="32" />
    <text class="lbl" y="0">{ ∅, {<tspan class="lbl-math">b</tspan>,<tspan class="lbl-math">c</tspan>}, <tspan class="lbl-math">X</tspan> }</text>
  </g>

  <!-- LEVEL 2: Intermediate Topologies -->
  <!-- Left: {∅, {a}, {b}, {a,b}, X} (5 sets) -->
  <g transform="translate(205, 130)">
    <rect class="node-box" x="-105" y="-16" width="210" height="32" />
    <text class="lbl" y="0">{ ∅, {<tspan class="lbl-math">a</tspan>}, {<tspan class="lbl-math">b</tspan>}, {<tspan class="lbl-math">a</tspan>,<tspan class="lbl-math">b</tspan>}, <tspan class="lbl-math">X</tspan> }</text>
  </g>

  <!-- Right: {∅, {a}, {b,c}, X} (4 sets - partition topology) -->
  <g transform="translate(400, 130)">
    <rect class="node-box" x="-90" y="-16" width="180" height="32" />
    <text class="lbl" y="0">{ ∅, {<tspan class="lbl-math">a</tspan>}, {<tspan class="lbl-math">b</tspan>,<tspan class="lbl-math">c</tspan>}, <tspan class="lbl-math">X</tspan> }</text>
  </g>

  <!-- LEVEL 3: Discrete Topology (Top) -->
  <g transform="translate(300, 48)">
    <rect class="node-extreme" x="-100" y="-18" width="200" height="36" />
    <text class="lbl" y="-1">
      <tspan class="lbl-math">τ</tspan><tspan dy="3" font-size="10">disc</tspan><tspan dy="-3"> = </tspan><tspan class="lbl-math">P</tspan><tspan>(</tspan><tspan class="lbl-math">X</tspan><tspan>) (8 sets)</tspan>
    </text>
    <text class="lbl-sub" y="-26">Discrete topology — finest</text>
  </g>
</svg>
