<svg viewBox="0 0 600 340" role="img" aria-labelledby="f1-title"
     xmlns="http://www.w3.org/2000/svg" class="fig">
  <title id="f1-title">Hasse Diagram of Topologies on a Three-Element Set</title>

  <defs>
    <marker id="arrow-lattice" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="var(--ink-soft)" />
    </marker>
  </defs>

  <!-- Fineness order indicator on left -->
  <line x1="42" y1="285" x2="42" y2="55" class="fig-tick" marker-end="url(#arrow-lattice)" />
  <text x="32" y="170" class="fig-caption-inline" transform="rotate(-90 32 170)" text-anchor="middle">Finer topology (⊇)</text>

  <!-- Lattice Edges (Inclusions) -->
  <!-- Level 0 to Level 1 -->
  <line x1="260" y1="275" x2="140" y2="225" stroke="var(--rule)" stroke-width="1.5" />
  <line x1="300" y1="275" x2="300" y2="225" stroke="var(--rule)" stroke-width="1.5" />
  <line x1="340" y1="275" x2="460" y2="225" stroke="var(--rule)" stroke-width="1.5" />

  <!-- Level 1 to Level 2 -->
  <line x1="140" y1="195" x2="195" y2="145" stroke="var(--rule)" stroke-width="1.5" />
  <line x1="150" y1="195" x2="385" y2="145" stroke="var(--rule)" stroke-width="1.5" />
  <line x1="285" y1="195" x2="215" y2="145" stroke="var(--rule)" stroke-width="1.5" />
  <line x1="460" y1="195" x2="415" y2="145" stroke="var(--rule)" stroke-width="1.5" />

  <!-- Level 2 to Level 3 -->
  <line x1="215" y1="115" x2="280" y2="65" stroke="var(--rule)" stroke-width="1.5" />
  <line x1="385" y1="115" x2="320" y2="65" stroke="var(--rule)" stroke-width="1.5" />

  <!-- Level 0: Trivial Topology (Bottom) -->
  <g transform="translate(300, 290)">
    <rect x="-85" y="-18" width="170" height="36" fill="var(--paper)" stroke="var(--rule)" stroke-width="1.5" rx="4" />
    <text x="0" y="5" class="fig-label" text-anchor="middle">τ_triv = { ∅, X }</text>
  </g>

  <!-- Level 1: 3-element topologies -->
  <g transform="translate(140, 210)">
    <rect x="-65" y="-16" width="130" height="32" fill="var(--paper)" stroke="var(--rule)" stroke-width="1.5" rx="4" />
    <text x="0" y="5" class="fig-tick" text-anchor="middle">{ ∅, {a}, X }</text>
  </g>

  <g transform="translate(300, 210)">
    <rect x="-65" y="-16" width="130" height="32" fill="var(--paper)" stroke="var(--rule)" stroke-width="1.5" rx="4" />
    <text x="0" y="5" class="fig-tick" text-anchor="middle">{ ∅, {b}, X }</text>
  </g>

  <g transform="translate(460, 210)">
    <rect x="-70" y="-16" width="140" height="32" fill="var(--paper)" stroke="var(--rule)" stroke-width="1.5" rx="4" />
    <text x="0" y="5" class="fig-tick" text-anchor="middle">{ ∅, {b,c}, X }</text>
  </g>

  <!-- Level 2: Intermediate topologies -->
  <g transform="translate(205, 130)">
    <rect x="-95" y="-16" width="190" height="32" fill="var(--paper)" stroke="var(--rule)" stroke-width="1.5" rx="4" />
    <text x="0" y="5" class="fig-tick" text-anchor="middle">{ ∅, {a}, {b}, {a,b}, X }</text>
  </g>

  <g transform="translate(400, 130)">
    <rect x="-85" y="-16" width="170" height="32" fill="var(--paper)" stroke="var(--rule)" stroke-width="1.5" rx="4" />
    <text x="0" y="5" class="fig-tick" text-anchor="middle">{ ∅, {a}, {b,c}, X }</text>
  </g>

  <!-- Level 3: Discrete Topology (Top, Focal) -->
  <g transform="translate(300, 48)">
    <rect x="-85" y="-18" width="170" height="36" fill="var(--paper)" stroke="var(--accent)" stroke-width="2" rx="4" />
    <text x="0" y="5" class="fig-focus" text-anchor="middle">τ_disc = 𝒫(X)</text>
  </g>
</svg>
