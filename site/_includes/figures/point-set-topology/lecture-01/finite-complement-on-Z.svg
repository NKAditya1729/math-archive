<svg viewBox="0 0 680 270" role="img" aria-labelledby="f2-title"
     xmlns="http://www.w3.org/2000/svg" class="fig">
  <title id="f2-title">The Finite Complement Topology on the Integers</title>

  <!-- Divider between panels -->
  <line x1="335" y1="20" x2="335" y2="250" class="fig-tick" stroke-dasharray="4 4" />

  <!-- Panel A: Open set in (Z, tau_fc) -->
  <text x="20" y="30" class="fig-label">Panel A: Open set in (ℤ, τ_fc)</text>

  <!-- Number Line -->
  <line x1="30" y1="100" x2="310" y2="100" class="fig-axis" />
  <text x="32" y="104" class="fig-tick" text-anchor="middle">···</text>
  <text x="308" y="104" class="fig-tick" text-anchor="middle">···</text>

  <!-- x = -3 (included) -->
  <circle cx="60" cy="100" r="4.5" fill="var(--accent)" />
  <text x="60" y="120" class="fig-tick" text-anchor="middle">−3</text>

  <!-- x = -2 (included) -->
  <circle cx="100" cy="100" r="4.5" fill="var(--accent)" />
  <text x="100" y="120" class="fig-tick" text-anchor="middle">−2</text>

  <!-- x = -1 (excluded) -->
  <circle cx="140" cy="100" r="5.5" fill="var(--paper)" stroke="var(--flag)" stroke-width="2" />
  <text x="140" y="120" class="fig-fail" text-anchor="middle">−1</text>
  <text x="140" y="85" class="fig-fail" font-size="11px" text-anchor="middle">excluded</text>

  <!-- x = 0 (included) -->
  <circle cx="180" cy="100" r="4.5" fill="var(--accent)" />
  <text x="180" y="120" class="fig-tick" text-anchor="middle">0</text>

  <!-- x = 1 (excluded) -->
  <circle cx="220" cy="100" r="5.5" fill="var(--paper)" stroke="var(--flag)" stroke-width="2" />
  <text x="220" y="120" class="fig-fail" text-anchor="middle">1</text>
  <text x="220" y="85" class="fig-fail" font-size="11px" text-anchor="middle">excluded</text>

  <!-- x = 2 (excluded) -->
  <circle cx="260" cy="100" r="5.5" fill="var(--paper)" stroke="var(--flag)" stroke-width="2" />
  <text x="260" y="120" class="fig-fail" text-anchor="middle">2</text>
  <text x="260" y="85" class="fig-fail" font-size="11px" text-anchor="middle">excluded</text>

  <!-- x = 3 (included) -->
  <circle cx="300" cy="100" r="4.5" fill="var(--accent)" />
  <text x="300" y="120" class="fig-tick" text-anchor="middle">3</text>

  <!-- Panel A description -->
  <text x="20" y="165" class="fig-caption-inline">U = ℤ ∖ {−1, 1, 2} has finite complement</text>
  <text x="20" y="185" class="fig-caption-inline">All but 3 points are included</text>

  <!-- Panel B: Infinite intersection -->
  <text x="350" y="30" class="fig-label">Panel B: Infinite intersection</text>

  <!-- Row 1 -->
  <rect x="350" y="48" width="310" height="26" fill="var(--paper)" stroke="var(--rule)" stroke-width="1" rx="3" />
  <text x="360" y="65" class="fig-tick">U_1 = ℤ ∖ {1} ∈ τ_fc</text>

  <!-- Row 2 -->
  <rect x="350" y="78" width="310" height="26" fill="var(--paper)" stroke="var(--rule)" stroke-width="1" rx="3" />
  <text x="360" y="95" class="fig-tick">U_1 ∩ U_2 = ℤ ∖ {1, 2} ∈ τ_fc</text>

  <!-- Row 3 -->
  <rect x="350" y="108" width="310" height="26" fill="var(--paper)" stroke="var(--rule)" stroke-width="1" rx="3" />
  <text x="360" y="125" class="fig-tick">U_1 ∩ U_2 ∩ U_3 = ℤ ∖ {1, 2, 3} ∈ τ_fc</text>

  <!-- Dots -->
  <text x="505" y="150" class="fig-caption-inline" text-anchor="middle">⋮ (countable intersection over all n ≥ 1)</text>

  <!-- Failure box -->
  <rect x="350" y="165" width="310" height="50" class="fig-region-fail" rx="4" />
  <text x="360" y="188" class="fig-fail">⋂_{n ≥ 1} U_n = {···, −2, −1, 0} ∉ τ_fc</text>
  <text x="360" y="206" class="fig-caption-inline">Complement {1, 2, 3, ···} is infinite</text>

  <!-- Bottom note -->
  <text x="350" y="245" class="fig-caption-inline">Infinite intersection escapes the topology</text>
</svg>
