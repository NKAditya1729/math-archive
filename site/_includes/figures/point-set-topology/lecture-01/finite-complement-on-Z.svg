<svg viewBox="0 0 680 270" width="100%" height="auto" role="img" aria-labelledby="f2-title f2-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="f2-title">The Finite Complement Topology on the Integers</title>
  <desc id="f2-desc">Two-panel diagram: Panel A shows an open set on the integer line excluding three points; Panel B shows a countable intersection of open sets shrinking to a non-empty set of non-positive integers with infinite complement, failing to be open.</desc>

  <style>
    .panel-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 13px; font-weight: 600; fill: var(--ink); }
    .panel-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 11px; fill: var(--ink-soft); }
    .math-text { font-family: "Source Serif 4", Georgia, serif; font-size: 13px; fill: var(--ink); }
    .math-sub { font-family: "Source Serif 4", Georgia, serif; font-size: 11px; fill: var(--ink-soft); }
    .note-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 11px; fill: var(--ink-soft); }
    .tag-ok { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 11px; font-weight: 600; fill: var(--accent); }
    .tag-fail { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 11px; font-weight: 600; fill: var(--flag); }
    .axis { stroke: var(--rule); stroke-width: 1.5; stroke-linecap: round; }
    .pt-included { fill: var(--accent); }
    .pt-excluded { fill: var(--paper); stroke: var(--flag); stroke-width: 2; }
    .fail-box { fill: var(--flag-bg); stroke: var(--flag); stroke-width: 1; stroke-dasharray: 4 2; rx: 3; ry: 3; }
    .row-box { fill: var(--paper); stroke: var(--rule); stroke-width: 1; rx: 3; ry: 3; }
    .divider { stroke: var(--rule); stroke-width: 1; stroke-dasharray: 4 4; }
  </style>

  <!-- Divider between panels -->
  <line x1="330" y1="15" x2="330" y2="255" class="divider" />

  <!-- ======================================================================
       PANEL A: An open set in (Z, tau_fc)
       ====================================================================== -->
  <g transform="translate(15, 0)">
    <text x="5" y="24" class="panel-title">Panel A: An open set in (ℤ, τ<tspan font-size="10" dy="2">fc</tspan><tspan dy="-2">)</tspan></text>
    <text x="5" y="42" class="panel-sub">Every open set contains all but finitely many points</text>

    <!-- Formula example: U = Z \ {-1, 1, 2} -->
    <text x="5" y="72" class="math-text">
      <tspan font-style="italic">U</tspan> = ℤ ∖ { −1, 1, 2 }
      <tspan class="tag-ok" dx="8">∈ τ<tspan font-size="9" dy="2">fc</tspan><tspan dy="-2"> (OPEN)</tspan></tspan>
    </text>

    <!-- Number Line -->
    <g transform="translate(0, 115)">
      <line x1="15" y1="0" x2="295" y2="0" class="axis" />

      <!-- Dots left/right for infinity -->
      <text x="18" y="4" class="note-text" text-anchor="middle">···</text>
      <text x="292" y="4" class="note-text" text-anchor="middle">···</text>

      <!-- x=-3 (included) -->
      <circle cx="50" cy="0" r="5" class="pt-included" />
      <text x="50" y="18" class="note-text" text-anchor="middle">−3</text>

      <!-- x=-2 (included) -->
      <circle cx="85" cy="0" r="5" class="pt-included" />
      <text x="85" y="18" class="note-text" text-anchor="middle">−2</text>

      <!-- x=-1 (EXCLUDED) -->
      <circle cx="120" cy="0" r="6" class="pt-excluded" />
      <text x="120" y="18" class="note-text" font-weight="600" fill="var(--flag)" text-anchor="middle">−1</text>
      <text x="120" y="-12" class="note-text" font-size="9" fill="var(--flag)" text-anchor="middle">excluded</text>
      <line x1="120" y1="-8" x2="120" y2="-4" stroke="var(--flag)" stroke-width="1" />

      <!-- x=0 (included) -->
      <circle cx="155" cy="0" r="5" class="pt-included" />
      <text x="155" y="18" class="note-text" text-anchor="middle">0</text>

      <!-- x=1 (EXCLUDED) -->
      <circle cx="190" cy="0" r="6" class="pt-excluded" />
      <text x="190" y="18" class="note-text" font-weight="600" fill="var(--flag)" text-anchor="middle">1</text>
      <text x="190" y="-12" class="note-text" font-size="9" fill="var(--flag)" text-anchor="middle">excluded</text>
      <line x1="190" y1="-8" x2="190" y2="-4" stroke="var(--flag)" stroke-width="1" />

      <!-- x=2 (EXCLUDED) -->
      <circle cx="225" cy="0" r="6" class="pt-excluded" />
      <text x="225" y="18" class="note-text" font-weight="600" fill="var(--flag)" text-anchor="middle">2</text>
      <text x="225" y="-12" class="note-text" font-size="9" fill="var(--flag)" text-anchor="middle">excluded</text>
      <line x1="225" y1="-8" x2="225" y2="-4" stroke="var(--flag)" stroke-width="1" />

      <!-- x=3 (included) -->
      <circle cx="260" cy="0" r="5" class="pt-included" />
      <text x="260" y="18" class="note-text" text-anchor="middle">3</text>
    </g>

    <!-- Legend & Explanation -->
    <g transform="translate(10, 165)">
      <!-- Legend row 1 -->
      <circle cx="6" cy="6" r="4.5" class="pt-included" />
      <text x="18" y="10" class="note-text">Point in <tspan font-style="italic">U</tspan> (infinitely many included points)</text>

      <!-- Legend row 2 -->
      <circle cx="6" cy="24" r="5" class="pt-excluded" />
      <text x="18" y="28" class="note-text">Excluded point (only 3 points removed)</text>
    </g>

    <text x="10" y="222" class="note-text" fill="var(--ink)">
      Complement ℤ ∖ <tspan font-style="italic">U</tspan> = { −1, 1, 2 } has cardinality 3 (finite).
    </text>
    <text x="10" y="240" class="note-text">
      Open sets here are enormous: they cannot be localized intervals.
    </text>
  </g>

  <!-- ======================================================================
       PANEL B: Infinite intersection failing (T2)
       ====================================================================== -->
  <g transform="translate(345, 0)">
    <text x="5" y="24" class="panel-title">Panel B: Why (T2) requires finiteness</text>
    <text x="5" y="42" class="panel-sub">Intersecting infinitely many open sets can escape τ<tspan font-size="9" dy="2">fc</tspan><tspan dy="-2"></tspan></text>

    <!-- Row 1 -->
    <g transform="translate(5, 58)">
      <rect class="row-box" x="0" y="0" width="315" height="26" />
      <text x="10" y="17" class="math-text">
        <tspan font-style="italic">U</tspan><tspan font-size="9" dy="2">1</tspan><tspan dy="-2"> = ℤ ∖ {1}</tspan>
      </text>
      <text x="185" y="17" class="note-text">compl. {1} (size 1)</text>
      <text x="285" y="17" class="tag-ok">✓</text>
    </g>

    <!-- Row 2 -->
    <g transform="translate(5, 90)">
      <rect class="row-box" x="0" y="0" width="315" height="26" />
      <text x="10" y="17" class="math-text">
        <tspan font-style="italic">U</tspan><tspan font-size="9" dy="2">1</tspan><tspan dy="-2"> ∩ </tspan><tspan font-style="italic">U</tspan><tspan font-size="9" dy="2">2</tspan><tspan dy="-2"> = ℤ ∖ {1, 2}</tspan>
      </text>
      <text x="185" y="17" class="note-text">compl. {1,2} (size 2)</text>
      <text x="285" y="17" class="tag-ok">✓</text>
    </g>

    <!-- Row 3 -->
    <g transform="translate(5, 122)">
      <rect class="row-box" x="0" y="0" width="315" height="26" />
      <text x="10" y="17" class="math-text">
        <tspan font-style="italic">U</tspan><tspan font-size="9" dy="2">1</tspan><tspan dy="-2"> ∩ </tspan><tspan font-style="italic">U</tspan><tspan font-size="9" dy="2">2</tspan><tspan dy="-2"> ∩ </tspan><tspan font-style="italic">U</tspan><tspan font-size="9" dy="2">3</tspan><tspan dy="-2"> = ℤ ∖ {1, 2, 3}</tspan>
      </text>
      <text x="185" y="17" class="note-text">compl. size 3</text>
      <text x="285" y="17" class="tag-ok">✓</text>
    </g>

    <!-- Down dots / arrow -->
    <text x="160" y="160" class="note-text" text-anchor="middle">⋮ (countable intersection over all n ≥ 1)</text>

    <!-- Failure Row (Visibly shows that intersection is non-empty and retains 0 and negative integers) -->
    <g transform="translate(5, 168)">
      <rect class="fail-box" x="0" y="0" width="315" height="52" />
      <text x="8" y="17" class="math-text" font-size="12">
        ⋂<tspan font-size="8" dy="3"><tspan font-style="italic">n</tspan>≥1</tspan><tspan dy="-3"> </tspan><tspan font-style="italic">U</tspan><tspan font-size="8" dy="3"><tspan font-style="italic">n</tspan></tspan><tspan dy="-3"> = ℤ ∖ {1,2,3,···} = {···,−2,−1,0}</tspan>
      </text>
      <text x="278" y="17" class="tag-fail">∉ τ<tspan font-size="9" dy="2">fc</tspan><tspan dy="-2"> ✗</tspan></text>
      <text x="8" y="33" class="note-text" font-weight="600" fill="var(--flag)">
        Non-empty: retains 0 and all negative integers.
      </text>
      <text x="8" y="46" class="note-text" fill="var(--flag)">
        Complement {1, 2, 3, ···} is infinite — NOT open!
      </text>
    </g>

    <text x="10" y="235" class="note-text">
      Union of finitely many finite sets is finite;
    </text>
    <text x="10" y="250" class="note-text">
      union of <tspan font-weight="600">infinitely many</tspan> finite sets can be infinite.
    </text>
  </g>
</svg>
