<svg viewBox="0 0 640 340" role="img" aria-labelledby="fig-closed-disc-title"
     xmlns="http://www.w3.org/2000/svg" class="fig">
  <title id="fig-closed-disc-title">The closed unit disc V in R^2 with solid boundary circle, showing that any open square S_epsilon(1,0) centered at the boundary point (1,0) protrudes outside V into the region x^2 + y^2 &gt; 1.</title>
  <defs>
    <marker id="arrow-axis-6" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 2 1 L 8 5 L 2 9 z" fill="var(--ink)" />
    </marker>
  </defs>

  <style>
    .axis { stroke: var(--ink); stroke-width: 1.2; }
    .disc-interior { fill: var(--accent); fill-opacity: 0.12; }
    .disc-boundary { stroke: var(--accent); stroke-width: 2.5; fill: none; }
    .fail-square-1 { stroke: var(--flag); stroke-width: 2; stroke-dasharray: 5 3; fill: var(--flag); fill-opacity: 0.14; }
    .fail-square-2 { stroke: var(--flag); stroke-width: 1.5; stroke-dasharray: 4 2; fill: var(--flag); fill-opacity: 0.20; }
    .label { font-family: 'Source Serif 4', Georgia, serif; font-size: 14px; fill: var(--ink); text-anchor: middle; }
    .label-italic { font-family: 'Source Serif 4', Georgia, serif; font-size: 14px; font-style: italic; fill: var(--ink); text-anchor: middle; }
    .label-fail { font-family: 'Source Serif 4', Georgia, serif; font-size: 13px; font-style: italic; fill: var(--flag); }
    .label-soft { font-family: 'Source Serif 4', Georgia, serif; font-size: 13px; font-style: italic; fill: var(--ink-soft); }
  </style>

  <!-- Background -->
  <rect width="640" height="340" fill="var(--paper)" />

  <!-- Center of disc at (240, 170), Radius R = 120 px -->

  <!-- Disc Interior -->
  <circle cx="240" cy="170" r="120" class="disc-interior" />

  <!-- Axes passing through (240, 170) -->
  <line x1="60" y1="170" x2="560" y2="170" class="axis" marker-end="url(#arrow-axis-6)" />
  <text x="575" y="174" class="label-italic">x</text>

  <line x1="240" y1="310" x2="240" y2="30" class="axis" marker-end="url(#arrow-axis-6)" />
  <text x="240" y="20" class="label-italic">y</text>

  <!-- Solid boundary circle of radius 1 (INCLUDED) -->
  <circle cx="240" cy="170" r="120" class="disc-boundary" />

  <!-- Boundary point (1,0) at (360, 170) -->
  <!-- Squares centered at (360, 170): -->
  <!-- Square 1: eps_1 = 50 px -> from x = 310 to 410, y = 120 to 220 -->
  <rect x="310" y="120" width="100" height="100" class="fail-square-1" />

  <!-- Square 2: eps_2 = 26 px -> from x = 334 to 386, y = 144 to 196 -->
  <rect x="334" y="144" width="52" height="52" class="fail-square-2" />

  <!-- Callout leader from protruding region of Square 1 -->
  <path d="M 395 140 L 460 100 L 510 100" fill="none" stroke="var(--flag)" stroke-width="1.3" />
  <text x="515" y="96" class="label-fail" text-anchor="start">escapes into x² + y² &gt; 1</text>
  <text x="515" y="114" class="label-soft" text-anchor="start">contains points (1 + δ, 0) with δ &gt; 0</text>

  <!-- Point (1,0): solid filled disc in boundary -->
  <circle cx="360" cy="170" r="5" fill="var(--ink)" />
  <text x="360" y="195" class="label-italic" style="font-weight: bold; font-size: 14px;">(1,0)</text>

  <!-- Labels on disc -->
  <text x="170" y="235" class="label-italic" style="font-size: 16px; fill: var(--accent); font-weight: 600;">V = {(x,y) : x² + y² ≤ 1}</text>
  <text x="170" y="255" class="label-soft">solid boundary: points with x² + y² = 1 included</text>

  <!-- Explanation callout -->
  <text x="440" y="250" class="label-fail" text-anchor="middle" style="font-weight: 600;">No ε &gt; 0 works:</text>
  <text x="440" y="270" class="label-italic" style="font-size: 13px; fill: var(--ink-soft);" text-anchor="middle">S_ε(1,0) ⊈ V for every ε &gt; 0</text>
</svg>
