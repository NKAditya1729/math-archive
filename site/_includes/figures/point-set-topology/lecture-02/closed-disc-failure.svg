<svg viewBox="0 0 640 340" role="img" aria-labelledby="fig-closed-disc-title"
     xmlns="http://www.w3.org/2000/svg" class="fig">
  <title id="fig-closed-disc-title">The closed unit disc V in R^2 with solid boundary circle, showing that any open square S_epsilon(1,0) centered at the boundary point (1,0) protrudes outside V into the region x^2 + y^2 &gt; 1.</title>
  <defs>
    <marker id="arrow-axis-6" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 2 1 L 8 5 L 2 9 z" fill="var(--ink)" />
    </marker>
  </defs>

  <!-- Disc Interior -->
  <circle cx="240" cy="170" r="120" class="fig-region" />
  <!-- Solid boundary circle (included) -->
  <circle cx="240" cy="170" r="120" stroke="var(--accent)" stroke-width="2.5" fill="none" />

  <!-- Axes passing through (240, 170) -->
  <line x1="60" y1="170" x2="560" y2="170" class="fig-axis" marker-end="url(#arrow-axis-6)" />
  <text x="575" y="174" class="fig-label">x</text>

  <line x1="240" y1="310" x2="240" y2="30" class="fig-axis" marker-end="url(#arrow-axis-6)" />
  <text x="240" y="20" class="fig-label">y</text>

  <!-- Boundary point (1,0) at (360, 170) -->
  <!-- Failing squares centered at (360, 170): -->
  <rect x="315" y="125" width="90" height="90" class="fig-region-fail" />
  <rect x="335" y="145" width="50" height="50" class="fig-fail" />

  <!-- Leader callout from protruding region of Square -->
  <path d="M 395 140 L 445 110 L 475 110" fill="none" stroke="var(--flag)" stroke-width="1.2" />
  <text x="480" y="114" class="fig-fail">escapes V</text>
  <text x="480" y="132" class="fig-caption-inline">No ε &gt; 0 works</text>

  <!-- Point (1,0): solid filled disc on boundary (Focal) -->
  <circle cx="360" cy="170" r="5" fill="var(--ink)" />
  <text x="360" y="195" class="fig-focus" text-anchor="middle">(1, 0)</text>

  <!-- Disc label V -->
  <text x="150" y="100" class="fig-label">V</text>
</svg>
