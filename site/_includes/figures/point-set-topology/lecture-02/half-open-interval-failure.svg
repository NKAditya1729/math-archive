<svg viewBox="0 0 640 210" role="img" aria-labelledby="fig-half-open-title"
     xmlns="http://www.w3.org/2000/svg" class="fig">
  <title id="fig-half-open-title">The half-open interval [0,1) failing property (*) at the boundary point 0, where any epsilon-interval (-epsilon, epsilon) contains negative numbers escaping into the complement.</title>
  <defs>
    <marker id="arrow-left-2" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 8 1 L 2 5 L 8 9 z" fill="var(--ink)" />
    </marker>
    <marker id="arrow-right-2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 2 1 L 8 5 L 2 9 z" fill="var(--ink)" />
    </marker>
  </defs>

  <style>
    .axis { stroke: var(--ink); stroke-width: 1.5; }
    .interval-valid { stroke: var(--accent); stroke-width: 3.5; stroke-linecap: round; }
    .fail-span { stroke: var(--flag); stroke-width: 2.5; stroke-dasharray: 4 3; fill: var(--flag); fill-opacity: 0.15; }
    .dim-line { stroke: var(--ink-soft); stroke-width: 1; stroke-dasharray: 2 2; }
    .label { font-family: 'Source Serif 4', Georgia, serif; font-size: 15px; fill: var(--ink); text-anchor: middle; }
    .label-italic { font-family: 'Source Serif 4', Georgia, serif; font-size: 15px; font-style: italic; fill: var(--ink); text-anchor: middle; }
    .label-fail { font-family: 'Source Serif 4', Georgia, serif; font-size: 14px; font-style: italic; fill: var(--flag); text-anchor: middle; }
  </style>

  <!-- Background -->
  <rect width="640" height="210" fill="var(--paper)" />

  <!-- Real line axis -->
  <line x1="40" y1="110" x2="600" y2="110" class="axis" marker-start="url(#arrow-left-2)" marker-end="url(#arrow-right-2)" />
  <text x="615" y="115" class="label-italic">ℝ</text>

  <!-- Half-open interval [0, 1) -->
  <line x1="220" y1="110" x2="520" y2="110" class="interval-valid" />

  <!-- The failing neighbourhood around 0: (-eps, +eps) -->
  <!-- eps = 70 px. Center is 220. Left is 150 (-eps), Right is 290 (+eps) -->
  <!-- Failing left portion: 150 to 220 in --flag -->
  <rect x="150" y="96" width="70" height="28" rx="4" class="fail-span" />
  <line x1="150" y1="110" x2="220" y2="110" stroke="var(--flag)" stroke-width="3.5" stroke-dasharray="4 2" />

  <!-- Inside portion: 220 to 290 in accent/soft -->
  <rect x="220" y="96" width="70" height="28" rx="4" fill="var(--accent)" fill-opacity="0.12" stroke="var(--accent)" stroke-width="1.5" stroke-dasharray="3 3" />

  <!-- Callout for failing escape region -->
  <path d="M 185 96 L 185 55 L 140 55" fill="none" stroke="var(--flag)" stroke-width="1.2" />
  <text x="135" y="50" class="label-fail" text-anchor="end">escapes [0, 1) into ℝ &lt; 0</text>

  <!-- Left boundary of nhood: -eps -->
  <line x1="150" y1="124" x2="150" y2="155" class="dim-line" />
  <text x="150" y="172" class="label-fail">−ε</text>

  <!-- Right boundary of nhood: +eps -->
  <line x1="290" y1="124" x2="290" y2="155" class="dim-line" />
  <text x="290" y="172" class="label-italic" style="fill: var(--ink-soft);">+ε</text>

  <!-- Center point 0: INCLUDED in [0,1) -> solid filled disc -->
  <circle cx="220" cy="110" r="5" fill="var(--accent)" stroke="var(--ink)" stroke-width="1.5" />
  <text x="220" y="142" class="label" style="font-weight: 600;">0</text>
  <text x="220" y="160" class="label-italic" style="font-size: 13px; fill: var(--ink-soft);">(x = 0)</text>

  <!-- Right endpoint 1: EXCLUDED -> open circle -->
  <circle cx="520" cy="110" r="5.5" fill="var(--paper)" stroke="var(--accent)" stroke-width="2.5" />
  <text x="520" y="142" class="label">1</text>
</svg>
