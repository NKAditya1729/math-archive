<svg viewBox="0 0 640 210" role="img" aria-labelledby="fig-eps-interval-title"
     xmlns="http://www.w3.org/2000/svg" class="fig">
  <title id="fig-eps-interval-title">The open interval (0,1) on the real line with an interior point x, showing the distances x and 1-x to the boundary points, and the symmetric neighbourhood (x-epsilon, x+epsilon) contained entirely within (0,1).</title>
  <defs>
    <!-- Arrowhead markers -->
    <marker id="arrow-left" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 8 1 L 2 5 L 8 9 z" fill="var(--ink)" />
    </marker>
    <marker id="arrow-right" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 2 1 L 8 5 L 2 9 z" fill="var(--ink)" />
    </marker>
    <marker id="dim-tick-left" viewBox="0 0 2 10" refX="1" refY="5" markerWidth="2" markerHeight="8" orient="auto">
      <line x1="1" y1="1" x2="1" y2="9" stroke="var(--ink-soft)" stroke-width="1.5" />
    </marker>
    <marker id="dim-tick-right" viewBox="0 0 2 10" refX="1" refY="5" markerWidth="2" markerHeight="8" orient="auto">
      <line x1="1" y1="1" x2="1" y2="9" stroke="var(--ink-soft)" stroke-width="1.5" />
    </marker>
  </defs>

  <style>
    .axis { stroke: var(--ink); stroke-width: 1.5; }
    .interval { stroke: var(--accent); stroke-width: 3.5; stroke-linecap: round; }
    .nhood { stroke: var(--accent); stroke-width: 2; fill: var(--accent); fill-opacity: 0.18; }
    .dim-line { stroke: var(--ink-soft); stroke-width: 1; stroke-dasharray: 2 2; }
    .dim-bar { stroke: var(--ink-soft); stroke-width: 1.2; }
    .label { font-family: 'Source Serif 4', Georgia, serif; font-size: 15px; fill: var(--ink); text-anchor: middle; }
    .label-italic { font-family: 'Source Serif 4', Georgia, serif; font-size: 15px; font-style: italic; fill: var(--ink); text-anchor: middle; }
    .label-soft { font-family: 'Source Serif 4', Georgia, serif; font-size: 14px; font-style: italic; fill: var(--ink-soft); text-anchor: middle; }
  </style>

  <!-- Background / frame -->
  <rect width="640" height="210" fill="var(--paper)" />

  <!-- Real line axis -->
  <line x1="40" y1="115" x2="600" y2="115" class="axis" marker-start="url(#arrow-left)" marker-end="url(#arrow-right)" />
  <text x="615" y="120" class="label-italic">ℝ</text>

  <!-- Open interval (0, 1) highlighted -->
  <line x1="160" y1="115" x2="480" y2="115" class="interval" />

  <!-- Dimension line for distance x: from 160 to 270 -->
  <line x1="160" y1="110" x2="160" y2="55" class="dim-line" />
  <line x1="270" y1="110" x2="270" y2="55" class="dim-line" />
  <line x1="160" y1="62" x2="270" y2="62" class="dim-bar" />
  <line x1="160" y1="57" x2="160" y2="67" class="dim-bar" />
  <line x1="270" y1="57" x2="270" y2="67" class="dim-bar" />
  <text x="215" y="52" class="label-soft">distance x</text>

  <!-- Dimension line for distance 1-x: from 270 to 480 -->
  <line x1="480" y1="110" x2="480" y2="55" class="dim-line" />
  <line x1="270" y1="62" x2="480" y2="62" class="dim-bar" />
  <line x1="480" y1="57" x2="480" y2="67" class="dim-bar" />
  <text x="375" y="52" class="label-soft">distance 1 − x</text>

  <!-- Epsilon interval around x: (x-eps, x+eps) -->
  <rect x="215" y="103" width="110" height="24" rx="4" class="nhood" />
  <line x1="215" y1="115" x2="325" y2="115" stroke="var(--accent)" stroke-width="4" />

  <!-- Left boundary of nhood x - eps -->
  <line x1="215" y1="127" x2="215" y2="160" class="dim-line" />
  <text x="215" y="176" class="label-italic" style="font-size: 13px;">x − ε</text>

  <!-- Right boundary of nhood x + eps -->
  <line x1="325" y1="127" x2="325" y2="160" class="dim-line" />
  <text x="325" y="176" class="label-italic" style="font-size: 13px;">x + ε</text>

  <!-- Centre point x -->
  <line x1="270" y1="127" x2="270" y2="145" class="dim-line" />
  <circle cx="270" cy="115" r="4.5" fill="var(--ink)" />
  <text x="270" y="158" class="label-italic" style="font-size: 15px; font-weight: bold;">x</text>

  <!-- Endpoints of (0,1): open circles -->
  <circle cx="160" cy="115" r="5.5" fill="var(--paper)" stroke="var(--accent)" stroke-width="2.5" />
  <text x="160" y="142" class="label">0</text>

  <circle cx="480" cy="115" r="5.5" fill="var(--paper)" stroke="var(--accent)" stroke-width="2.5" />
  <text x="480" y="142" class="label">1</text>
</svg>
