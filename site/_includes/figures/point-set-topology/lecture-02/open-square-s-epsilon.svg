<svg viewBox="0 0 640 360" role="img" aria-labelledby="fig-open-square-title"
     xmlns="http://www.w3.org/2000/svg" class="fig">
  <title id="fig-open-square-title">The open square S_epsilon(a,b) centered at (a,b) in R^2 with dashed boundary, showing the four half-distances of length epsilon from the center to each edge.</title>
  <defs>
    <marker id="arrow-axis" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 2 1 L 8 5 L 2 9 z" fill="var(--ink)" />
    </marker>
  </defs>

  <!-- Coordinate Axes -->
  <!-- x-axis -->
  <line x1="60" y1="300" x2="600" y2="300" class="fig-axis" marker-end="url(#arrow-axis)" />
  <text x="615" y="304" class="fig-label">x</text>

  <!-- y-axis -->
  <line x1="100" y1="330" x2="100" y2="40" class="fig-axis" marker-end="url(#arrow-axis)" />
  <text x="100" y="28" class="fig-label">y</text>

  <!-- Projection lines to axes -->
  <line x1="280" y1="250" x2="280" y2="300" class="fig-tick" stroke-dasharray="2 2" />
  <line x1="360" y1="170" x2="360" y2="300" class="fig-tick" stroke-dasharray="2 2" />
  <line x1="440" y1="250" x2="440" y2="300" class="fig-tick" stroke-dasharray="2 2" />

  <line x1="100" y1="250" x2="280" y2="250" class="fig-tick" stroke-dasharray="2 2" />
  <line x1="100" y1="170" x2="360" y2="170" class="fig-tick" stroke-dasharray="2 2" />
  <line x1="100" y1="90" x2="280" y2="90" class="fig-tick" stroke-dasharray="2 2" />

  <!-- Axis tick labels -->
  <text x="280" y="320" class="fig-tick" text-anchor="middle">a − ε</text>
  <text x="360" y="320" class="fig-label" text-anchor="middle">a</text>
  <text x="440" y="320" class="fig-tick" text-anchor="middle">a + ε</text>

  <text x="80" y="255" class="fig-tick" text-anchor="end">b − ε</text>
  <text x="80" y="175" class="fig-label" text-anchor="end">b</text>
  <text x="80" y="95" class="fig-tick" text-anchor="end">b + ε</text>

  <!-- Open Square S_eps(a,b) -->
  <rect x="280" y="90" width="160" height="160" class="fig-region" stroke-dasharray="6 4" />

  <!-- The 4 internal epsilon segments originating from (a,b) -->
  <!-- Centre (360, 170) to Right (440, 170) -->
  <line x1="360" y1="170" x2="440" y2="170" stroke="var(--accent)" stroke-width="1.5" />
  <line x1="440" y1="165" x2="440" y2="175" stroke="var(--accent)" stroke-width="1.5" />
  <text x="400" y="162" class="fig-tick" text-anchor="middle">ε</text>

  <!-- Centre (360, 170) to Left (280, 170) -->
  <line x1="360" y1="170" x2="280" y2="170" stroke="var(--accent)" stroke-width="1.5" />
  <line x1="280" y1="165" x2="280" y2="175" stroke="var(--accent)" stroke-width="1.5" />
  <text x="320" y="162" class="fig-tick" text-anchor="middle">ε</text>

  <!-- Centre (360, 170) to Top (360, 90) -->
  <line x1="360" y1="170" x2="360" y2="90" stroke="var(--accent)" stroke-width="1.5" />
  <line x1="355" y1="90" x2="365" y2="90" stroke="var(--accent)" stroke-width="1.5" />
  <text x="375" y="130" class="fig-tick" text-anchor="start">ε</text>

  <!-- Centre (360, 170) to Bottom (360, 250) -->
  <line x1="360" y1="170" x2="360" y2="250" stroke="var(--accent)" stroke-width="1.5" />
  <line x1="355" y1="250" x2="365" y2="250" stroke="var(--accent)" stroke-width="1.5" />
  <text x="375" y="215" class="fig-tick" text-anchor="start">ε</text>

  <!-- Centre point (a,b) placed in bottom-left offset to avoid collision -->
  <circle cx="360" cy="170" r="4.5" fill="var(--ink)" />
  <text x="345" y="195" class="fig-label" text-anchor="end">(a, b)</text>

  <!-- Square title (Focal) -->
  <text x="360" y="70" class="fig-focus" text-anchor="middle">S_ε(a,b)</text>
  <text x="500" y="175" class="fig-caption-inline">side length 2ε</text>
</svg>
