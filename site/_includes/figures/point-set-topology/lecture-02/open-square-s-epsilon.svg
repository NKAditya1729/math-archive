<svg viewBox="0 0 640 360" role="img" aria-labelledby="fig-open-square-title"
     xmlns="http://www.w3.org/2000/svg" class="fig">
  <title id="fig-open-square-title">The open square S_epsilon(a,b) centered at (a,b) in R^2 with dashed boundary, showing the four half-distances of length epsilon from the center to each edge.</title>
  <defs>
    <marker id="arrow-axis" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 2 1 L 8 5 L 2 9 z" fill="var(--ink)" />
    </marker>
  </defs>

  <style>
    .axis { stroke: var(--ink); stroke-width: 1.5; }
    .grid-line { stroke: var(--ink-soft); stroke-width: 1; stroke-dasharray: 2 2; opacity: 0.6; }
    .square-box { stroke: var(--accent); stroke-width: 2.5; stroke-dasharray: 6 4; fill: var(--accent); fill-opacity: 0.12; }
    .dim-line { stroke: var(--accent); stroke-width: 1.5; }
    .label { font-family: 'Source Serif 4', Georgia, serif; font-size: 14px; fill: var(--ink); text-anchor: middle; }
    .label-italic { font-family: 'Source Serif 4', Georgia, serif; font-size: 15px; font-style: italic; fill: var(--ink); text-anchor: middle; }
    .label-eps { font-family: 'Source Serif 4', Georgia, serif; font-size: 14px; font-style: italic; fill: var(--accent); font-weight: 600; text-anchor: middle; }
  </style>

  <!-- Background -->
  <rect width="640" height="360" fill="var(--paper)" />

  <!-- Coordinate Axes -->
  <!-- Origin at (100, 300) -->
  <!-- x-axis -->
  <line x1="60" y1="300" x2="600" y2="300" class="axis" marker-end="url(#arrow-axis)" />
  <text x="615" y="304" class="label-italic">x</text>

  <!-- y-axis -->
  <line x1="100" y1="330" x2="100" y2="40" class="axis" marker-end="url(#arrow-axis)" />
  <text x="100" y="28" class="label-italic">y</text>

  <!-- Coordinates of centre (a,b): let a = 360, b = 170 -->
  <!-- Epsilon = 80 px -->
  <!-- Square from x = 280 to 440, y = 90 to 250 -->

  <!-- Projection lines to axes -->
  <line x1="280" y1="250" x2="280" y2="300" class="grid-line" />
  <line x1="360" y1="170" x2="360" y2="300" class="grid-line" />
  <line x1="440" y1="250" x2="440" y2="300" class="grid-line" />

  <line x1="100" y1="250" x2="280" y2="250" class="grid-line" />
  <line x1="100" y1="170" x2="360" y2="170" class="grid-line" />
  <line x1="100" y1="90" x2="280" y2="90" class="grid-line" />

  <!-- Axis tick labels -->
  <text x="280" y="320" class="label-italic" style="font-size: 13px;">a − ε</text>
  <text x="360" y="320" class="label-italic" style="font-size: 14px; font-weight: bold;">a</text>
  <text x="440" y="320" class="label-italic" style="font-size: 13px;">a + ε</text>

  <text x="80" y="255" class="label-italic" style="font-size: 13px;" text-anchor="end">b − ε</text>
  <text x="80" y="175" class="label-italic" style="font-size: 14px; font-weight: bold;" text-anchor="end">b</text>
  <text x="80" y="95" class="label-italic" style="font-size: 13px;" text-anchor="end">b + ε</text>

  <!-- Open Square S_eps(a,b) -->
  <rect x="280" y="90" width="160" height="160" class="square-box" />

  <!-- The 4 internal epsilon segments originating from (a,b) -->
  <!-- Centre (360, 170) to Right (440, 170) -->
  <line x1="360" y1="170" x2="440" y2="170" class="dim-line" />
  <line x1="440" y1="165" x2="440" y2="175" stroke="var(--accent)" stroke-width="1.5" />
  <text x="400" y="162" class="label-eps">ε</text>

  <!-- Centre (360, 170) to Left (280, 170) -->
  <line x1="360" y1="170" x2="280" y2="170" class="dim-line" />
  <line x1="280" y1="165" x2="280" y2="175" stroke="var(--accent)" stroke-width="1.5" />
  <text x="320" y="162" class="label-eps">ε</text>

  <!-- Centre (360, 170) to Top (360, 90) -->
  <line x1="360" y1="170" x2="360" y2="90" class="dim-line" />
  <line x1="355" y1="90" x2="365" y2="90" stroke="var(--accent)" stroke-width="1.5" />
  <text x="375" y="130" class="label-eps" text-anchor="start">ε</text>

  <!-- Centre (360, 170) to Bottom (360, 250) -->
  <line x1="360" y1="170" x2="360" y2="250" class="dim-line" />
  <line x1="355" y1="250" x2="365" y2="250" stroke="var(--accent)" stroke-width="1.5" />
  <text x="375" y="215" class="label-eps" text-anchor="start">ε</text>

  <!-- Centre point (a,b) -->
  <circle cx="360" cy="170" r="5" fill="var(--ink)" />
  <text x="345" y="160" class="label-italic" style="font-weight: bold;">(a,b)</text>

  <!-- Square title / dimension callout -->
  <text x="360" y="65" class="label-italic" style="font-size: 16px; fill: var(--accent); font-weight: 600;">S_ε(a,b) = (a − ε, a + ε) × (b − ε, b + ε)</text>
  <text x="540" y="175" class="label-italic" style="font-size: 13px; fill: var(--ink-soft);">side length 2ε</text>
</svg>
