<svg viewBox="0 0 640 340" role="img" aria-labelledby="fig-open-disc-title"
     xmlns="http://www.w3.org/2000/svg" class="fig">
  <title id="fig-open-disc-title">The open unit disc U in R^2 with dashed boundary circle of radius 1, showing that around any interior point (a,b) an open square S_epsilon(a,b) can be found lying entirely inside U.</title>
  <defs>
    <marker id="arrow-axis-5" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 2 1 L 8 5 L 2 9 z" fill="var(--ink)" />
    </marker>
  </defs>

  <!-- Disc Interior -->
  <circle cx="280" cy="170" r="120" class="fig-region" stroke-dasharray="6 4" />

  <!-- Axes passing through (280, 170) -->
  <line x1="80" y1="170" x2="480" y2="170" class="fig-axis" marker-end="url(#arrow-axis-5)" />
  <text x="495" y="174" class="fig-label">x</text>

  <line x1="280" y1="310" x2="280" y2="30" class="fig-axis" marker-end="url(#arrow-axis-5)" />
  <text x="280" y="20" class="fig-label">y</text>

  <!-- Mark (1,0) on the boundary -->
  <circle cx="400" cy="170" r="4.5" fill="var(--paper)" stroke="var(--accent)" stroke-width="2" />
  <text x="405" y="190" class="fig-tick">1</text>

  <!-- Mark (-1,0), (0,1) labels softly -->
  <text x="155" y="190" class="fig-tick">−1</text>
  <text x="265" y="55" class="fig-tick">1</text>

  <!-- Interior point (a,b) at (230, 130) -->
  <!-- Chosen open square around (a,b) with side length 40 px -->
  <rect x="210" y="110" width="40" height="40" fill="var(--accent)" fill-opacity="0.25" stroke="var(--accent)" stroke-width="1.5" stroke-dasharray="4 3" />

  <!-- Centre point (a,b) -->
  <circle cx="230" cy="130" r="4" fill="var(--ink)" />
  <text x="222" y="125" class="fig-label" text-anchor="end">(a, b)</text>

  <!-- Leader line pointing to the square -->
  <path d="M 250 115 L 330 90 L 360 90" fill="none" stroke="var(--ink-soft)" stroke-width="1.2" />
  <text x="365" y="94" class="fig-tick">S_ε(a, b) ⊆ U</text>

  <!-- Disc label U (Focal) -->
  <text x="180" y="100" class="fig-focus">U</text>
</svg>
