<svg viewBox="0 0 640 340" role="img" aria-labelledby="fig-open-disc-title"
     xmlns="http://www.w3.org/2000/svg" class="fig">
  <title id="fig-open-disc-title">The open unit disc U in R^2 with dashed boundary circle of radius 1, showing that around any interior point (a,b) an open square S_epsilon(a,b) can be found lying entirely inside U.</title>
  <defs>
    <marker id="arrow-axis-5" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 2 1 L 8 5 L 2 9 z" fill="var(--ink)" />
    </marker>
  </defs>

  <style>
    .axis { stroke: var(--ink); stroke-width: 1.2; }
    .disc-interior { fill: var(--accent); fill-opacity: 0.12; }
    .disc-boundary { stroke: var(--accent); stroke-width: 2.5; stroke-dasharray: 6 4; fill: none; }
    .square-box { stroke: var(--accent); stroke-width: 2; stroke-dasharray: 4 3; fill: var(--accent); fill-opacity: 0.22; }
    .label { font-family: 'Source Serif 4', Georgia, serif; font-size: 14px; fill: var(--ink); text-anchor: middle; }
    .label-italic { font-family: 'Source Serif 4', Georgia, serif; font-size: 14px; font-style: italic; fill: var(--ink); text-anchor: middle; }
    .label-soft { font-family: 'Source Serif 4', Georgia, serif; font-size: 13px; font-style: italic; fill: var(--ink-soft); }
  </style>

  <!-- Background -->
  <rect width="640" height="340" fill="var(--paper)" />

  <!-- Center of disc at (280, 170), Radius R = 120 px -->

  <!-- Disc Interior -->
  <circle cx="280" cy="170" r="120" class="disc-interior" />

  <!-- Axes passing through (280, 170) -->
  <line x1="80" y1="170" x2="480" y2="170" class="axis" marker-end="url(#arrow-axis-5)" />
  <text x="495" y="174" class="label-italic">x</text>

  <line x1="280" y1="310" x2="280" y2="30" class="axis" marker-end="url(#arrow-axis-5)" />
  <text x="280" y="20" class="label-italic">y</text>

  <!-- Dashed boundary circle of radius 1 (excluded) -->
  <circle cx="280" cy="170" r="120" class="disc-boundary" />

  <!-- Mark (1,0) on the boundary -->
  <circle cx="400" cy="170" r="4.5" fill="var(--paper)" stroke="var(--accent)" stroke-width="2" />
  <text x="405" y="190" class="label-italic" style="font-size: 13px;">(1,0)</text>

  <!-- Mark (-1,0), (0,1), (0,-1) labels softly -->
  <text x="160" y="190" class="label-italic" style="font-size: 12px; fill: var(--ink-soft);">(−1,0)</text>
  <text x="260" y="55" class="label-italic" style="font-size: 12px; fill: var(--ink-soft);">(0,1)</text>

  <!-- Interior point (a,b): pick (230, 130) -> distance to center = sqrt(50^2 + 40^2) = 64 < 120 -->
  <!-- Chosen open square around (a,b) with side length 2*eps = 40 px (eps = 20 px) -->
  <rect x="210" y="110" width="40" height="40" class="square-box" />

  <!-- Centre point (a,b) -->
  <circle cx="230" cy="130" r="4" fill="var(--ink)" />
  <text x="220" y="125" class="label-italic" style="font-weight: bold;" text-anchor="end">(a,b)</text>

  <!-- Leader line pointing to the square -->
  <path d="M 245 115 L 340 75 L 380 75" fill="none" stroke="var(--ink-soft)" stroke-width="1.2" />
  <text x="385" y="79" class="label-italic" style="fill: var(--accent); font-weight: 600;" text-anchor="start">S_ε(a,b) ⊆ U</text>
  <text x="385" y="98" class="label-soft" text-anchor="start">ε small enough remains inside</text>

  <!-- Set name callout -->
  <text x="180" y="240" class="label-italic" style="font-size: 16px; fill: var(--accent); font-weight: 600;">U = {(x,y) : x² + y² &lt; 1}</text>
  <text x="180" y="260" class="label-soft">dashed boundary: points with x² + y² = 1 excluded</text>
</svg>
