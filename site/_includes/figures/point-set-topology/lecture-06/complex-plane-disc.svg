<svg viewBox="0 0 540 280" role="img" aria-labelledby="fig-c-plane-title"
     xmlns="http://www.w3.org/2000/svg" class="fig">
  <title id="fig-c-plane-title">The complex plane C identified with R^2: open discs B_epsilon(z) form a basis generating the standard topology.</title>

  <!-- Coordinate axes: Re(z) horizontal, Im(z) vertical -->
  <line x1="40" y1="210" x2="500" y2="210" class="fig-axis" />
  <polygon points="500,206 510,210 500,214" fill="var(--ink)" />
  <text x="490" y="235" class="fig-tick">Re</text>

  <line x1="100" y1="250" x2="100" y2="30" class="fig-axis" />
  <polygon points="96,30 100,20 104,30" fill="var(--ink)" />
  <text x="80" y="35" class="fig-tick">Im</text>

  <!-- Open set U in C (large organic shape) -->
  <path d="M 140 140 C 140 60, 240 50, 360 55 C 460 60, 480 110, 460 170 C 440 210, 340 215, 230 205 C 160 200, 140 180, 140 140 Z" fill="var(--ink-soft)" fill-opacity="0.06" stroke="var(--ink-soft)" stroke-width="1.5" stroke-dasharray="5 4" />
  <text x="180" y="85" class="fig-label">U</text>

  <!-- Open disc B_eps(z) around z (Focal) -->
  <circle cx="280" cy="130" r="45" class="fig-region" stroke-dasharray="4 3" />

  <!-- Centre point z -->
  <circle cx="280" cy="130" r="4" fill="var(--ink)" />
  <text x="270" y="125" class="fig-label" text-anchor="end">z</text>

  <!-- Callout for disc -->
  <path d="M 320 110 L 370 85 L 400 85" fill="none" stroke="var(--accent)" stroke-width="1.2" />
  <text x="405" y="90" class="fig-focus">B_ε(z) ⊆ U</text>
</svg>
