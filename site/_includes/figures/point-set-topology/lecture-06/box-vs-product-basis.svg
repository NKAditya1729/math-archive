<svg viewBox="0 0 620 260" role="img" aria-labelledby="fig-box-prod-title"
     xmlns="http://www.w3.org/2000/svg" class="fig">
  <title id="fig-box-prod-title">Comparison of basic open sets in infinite products: the box topology allows restrictions on all coordinates, while the product topology restricts only finitely many coordinates.</title>

  <!-- Center Divider -->
  <line x1="310" y1="20" x2="310" y2="240" class="fig-tick" stroke-dasharray="4 4" />

  <!-- LEFT PANEL: Box Topology -->
  <text x="155" y="32" class="fig-label" text-anchor="middle">Box basis (ℬ_box)</text>

  <!-- Coordinate rows for Box -->
  <text x="35" y="80" class="fig-label">X_1 :</text>
  <rect x="65" y="67" width="200" height="18" fill="var(--ink-soft)" fill-opacity="0.06" stroke="var(--ink-soft)" stroke-width="1" stroke-dasharray="4 3" />
  <rect x="95" y="67" width="90" height="18" class="fig-region" />
  <text x="140" y="80" class="fig-tick" text-anchor="middle">U_1 ⊊ X_1</text>

  <text x="35" y="115" class="fig-label">X_2 :</text>
  <rect x="65" y="102" width="200" height="18" fill="var(--ink-soft)" fill-opacity="0.06" stroke="var(--ink-soft)" stroke-width="1" stroke-dasharray="4 3" />
  <rect x="120" y="102" width="80" height="18" class="fig-region" />
  <text x="160" y="115" class="fig-tick" text-anchor="middle">U_2 ⊊ X_2</text>

  <text x="35" y="150" class="fig-label">X_3 :</text>
  <rect x="65" y="137" width="200" height="18" fill="var(--ink-soft)" fill-opacity="0.06" stroke="var(--ink-soft)" stroke-width="1" stroke-dasharray="4 3" />
  <rect x="80" y="137" width="100" height="18" class="fig-region" />
  <text x="130" y="150" class="fig-tick" text-anchor="middle">U_3 ⊊ X_3</text>

  <text x="155" y="185" class="fig-caption-inline" text-anchor="middle">⋮ (every factor may be restricted)</text>

  <!-- RIGHT PANEL: Product Topology (Focal) -->
  <text x="465" y="32" class="fig-focus" text-anchor="middle">Product basis (ℬ_prod)</text>

  <!-- Coordinate rows for Product -->
  <text x="345" y="80" class="fig-label">X_1 :</text>
  <rect x="375" y="67" width="200" height="18" fill="var(--ink-soft)" fill-opacity="0.06" stroke="var(--ink-soft)" stroke-width="1" stroke-dasharray="4 3" />
  <rect x="405" y="67" width="90" height="18" class="fig-region" />
  <text x="450" y="80" class="fig-tick" text-anchor="middle">U_1 ⊊ X_1</text>

  <text x="345" y="115" class="fig-label">X_2 :</text>
  <rect x="375" y="102" width="200" height="18" fill="var(--ink-soft)" fill-opacity="0.06" stroke="var(--ink-soft)" stroke-width="1" stroke-dasharray="4 3" />
  <rect x="430" y="102" width="80" height="18" class="fig-region" />
  <text x="470" y="115" class="fig-tick" text-anchor="middle">U_2 ⊊ X_2</text>

  <text x="345" y="150" class="fig-label">X_3 :</text>
  <rect x="375" y="137" width="200" height="18" fill="var(--accent)" fill-opacity="0.10" stroke="var(--accent)" stroke-width="1" />
  <text x="475" y="150" class="fig-tick" text-anchor="middle">U_3 = X_3</text>

  <text x="465" y="185" class="fig-caption-inline" text-anchor="middle">⋮ (all remaining U_i = X_i)</text>
</svg>
