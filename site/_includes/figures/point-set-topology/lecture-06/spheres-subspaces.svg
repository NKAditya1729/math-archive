<svg viewBox="0 0 600 280" role="img" aria-labelledby="fig-spheres-title"
     xmlns="http://www.w3.org/2000/svg" class="fig">
  <title id="fig-spheres-title">Spheres as subspaces of Euclidean spaces: the circle S^1 in R^2 and sphere S^n in R^{n+1}, showing relative open sets as intersected open neighborhoods.</title>

  <!-- Center divider -->
  <line x1="300" y1="20" x2="300" y2="260" class="fig-tick" stroke-dasharray="4 4" />

  <!-- LEFT PANEL: Circle S^1 -->
  <text x="150" y="32" class="fig-label" text-anchor="middle">Circle S¹</text>

  <!-- Ambient R^2 axes -->
  <line x1="40" y1="140" x2="260" y2="140" class="fig-axis" stroke-opacity="0.4" />
  <line x1="150" y1="250" x2="150" y2="40" class="fig-axis" stroke-opacity="0.4" />

  <!-- Unit circle S^1 -->
  <circle cx="150" cy="140" r="70" stroke="var(--ink)" stroke-width="2" fill="none" />

  <!-- Open set U in R^2 (intersecting the circle) -->
  <circle cx="195" cy="95" r="35" fill="var(--ink-soft)" fill-opacity="0.06" stroke="var(--ink-soft)" stroke-width="1.5" stroke-dasharray="4 3" />
  <text x="235" y="85" class="fig-label">U</text>

  <!-- Open arc U ∩ S^1 on the circle -->
  <path d="M 172 73 A 70 70 0 0 1 217 118" fill="none" stroke="var(--accent)" stroke-width="4" stroke-linecap="round" />
  <text x="215" y="145" class="fig-tick">U ∩ S¹</text>

  <!-- RIGHT PANEL: Sphere S^n (Focal) -->
  <text x="450" y="32" class="fig-focus" text-anchor="middle">Sphere Sⁿ</text>

  <!-- Sphere S^2 outline -->
  <circle cx="450" cy="140" r="70" stroke="var(--ink)" stroke-width="2" fill="none" />
  <!-- Equator ellipse -->
  <ellipse cx="450" cy="140" rx="70" ry="22" stroke="var(--ink-soft)" stroke-width="1.2" stroke-dasharray="3 3" fill="none" />

  <!-- Open set U in R^{n+1} -->
  <circle cx="450" cy="80" r="30" fill="var(--ink-soft)" fill-opacity="0.06" stroke="var(--ink-soft)" stroke-width="1.5" stroke-dasharray="4 3" />
  <text x="490" y="75" class="fig-label">U</text>

  <!-- Open spherical cap U ∩ S^n -->
  <path d="M 425 74 A 70 70 0 0 1 475 74" fill="none" stroke="var(--accent)" stroke-width="4" stroke-linecap="round" />
  <ellipse cx="450" cy="74" rx="25" ry="8" class="fig-region" />
  <text x="450" y="105" class="fig-tick" text-anchor="middle">U ∩ Sⁿ</text>
</svg>
