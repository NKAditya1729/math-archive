<svg viewBox="0 0 660 250" role="img" aria-labelledby="t-circ"
     xmlns="http://www.w3.org/2000/svg" class="fig">
  <title id="t-circ">The circle S^1 as the preimage of the closed singleton {1} under f(x,y) = x^2 + y^2</title>
  <defs>
    <marker id="arrowhead-circ" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <polygon points="0 0, 7 3.5, 0 7" fill="var(--ink)" />
    </marker>
  </defs>

  <!-- Left: Domain R^2 with S^1 -->
  <g transform="translate(20, 20)">
    <!-- Axes -->
    <line x1="20" y1="110" x2="240" y2="110" class="fig-axis" />
    <line x1="130" y1="210" x2="130" y2="10" class="fig-axis" />
    <text x="230" y="125" class="fig-tick">x</text>
    <text x="138" y="22" class="fig-tick">y</text>

    <!-- Circle S^1 (Focal) -->
    <circle cx="130" cy="110" r="70" stroke="var(--accent)" stroke-width="2.5" fill="none" />
    <text x="180" y="65" class="fig-focus">S¹</text>

    <text x="130" y="235" class="fig-label" text-anchor="middle">Domain ℝ²</text>
  </g>

  <!-- Mapping arrow f(x,y) = x^2 + y^2 -->
  <line x1="280" y1="110" x2="380" y2="110" class="fig-axis" marker-end="url(#arrowhead-circ)" />
  <text x="330" y="95" class="fig-label" text-anchor="middle">f(x, y) = x² + y²</text>
  <text x="330" y="130" class="fig-tick" text-anchor="middle">continuous</text>

  <!-- Right: Codomain R with singleton {1} -->
  <g transform="translate(390, 20)">
    <!-- Number line R -->
    <line x1="20" y1="110" x2="230" y2="110" class="fig-axis" />
    <text x="220" y="130" class="fig-tick">ℝ</text>

    <!-- Origin 0 -->
    <line x1="50" y1="105" x2="50" y2="115" stroke="var(--ink)" stroke-width="1.5" />
    <text x="47" y="130" class="fig-tick">0</text>

    <!-- Singleton {1} -->
    <circle cx="120" cy="110" r="4.5" fill="var(--flag)" />
    <text x="120" y="90" class="fig-fail" text-anchor="middle">{1}</text>
    <text x="120" y="130" class="fig-tick" text-anchor="middle">1</text>

    <text x="125" y="235" class="fig-label" text-anchor="middle">Codomain ℝ</text>
  </g>
</svg>
