<svg viewBox="0 0 680 280" role="img" aria-labelledby="t-std-prod"
     xmlns="http://www.w3.org/2000/svg" class="fig">
  <title id="t-std-prod">Inscribing an open square S_epsilon(x) of side 2 epsilon inside an open product rectangle U_1 x U_2</title>

  <!-- Left panel: Inscribing square S_eps(x) -->
  <g transform="translate(20, 20)">
    <!-- Axes -->
    <line x1="30" y1="220" x2="290" y2="220" class="fig-axis" />
    <line x1="30" y1="220" x2="30" y2="10" class="fig-axis" />
    <text x="280" y="240" class="fig-label">x₁</text>
    <text x="15" y="20" class="fig-label">x₂</text>

    <!-- Product box U1 x U2 -->
    <rect x="60" y="40" width="200" height="140" fill="var(--ink-soft)" fill-opacity="0.06" stroke="var(--ink-soft)" stroke-width="1.5" stroke-dasharray="5 5" rx="4" />
    <text x="170" y="58" class="fig-label">U₁ × U₂</text>

    <!-- Square S_eps(x) (Focal) -->
    <rect x="100" y="80" width="80" height="80" class="fig-region" rx="2" />
    <circle cx="140" cy="120" r="3.5" fill="var(--ink)" />
    <text x="146" y="116" class="fig-label">x</text>
    <text x="108" y="150" class="fig-focus">S_ε(x)</text>

    <!-- Coordinate projections to axes -->
    <line x1="140" y1="120" x2="140" y2="220" class="fig-tick" stroke-dasharray="3 3" />
    <line x1="140" y1="120" x2="30" y2="120" class="fig-tick" stroke-dasharray="3 3" />

    <!-- Interval B_epsilon(x1) on horizontal axis -->
    <line x1="100" y1="220" x2="180" y2="220" stroke="var(--accent)" stroke-width="3.5" stroke-linecap="round" />
    <text x="140" y="255" class="fig-tick" text-anchor="middle">B_ε(x₁)</text>

    <!-- Interval B_epsilon(x2) on vertical axis -->
    <line x1="30" y1="80" x2="30" y2="160" stroke="var(--accent)" stroke-width="3.5" stroke-linecap="round" />
    <text x="25" y="72" class="fig-tick" text-anchor="end">B_ε(x₂)</text>
  </g>

  <!-- Right panel: Union over all x covers U1 x U2 -->
  <g transform="translate(360, 20)">
    <line x1="30" y1="220" x2="290" y2="220" class="fig-axis" />
    <line x1="30" y1="220" x2="30" y2="10" class="fig-axis" />
    <text x="280" y="240" class="fig-label">x₁</text>
    <text x="15" y="20" class="fig-label">x₂</text>

    <rect x="60" y="40" width="200" height="140" fill="var(--ink-soft)" fill-opacity="0.06" stroke="var(--ink-soft)" stroke-width="1.5" stroke-dasharray="5 5" rx="4" />

    <!-- Multiple overlapping squares filling the region -->
    <rect x="75" y="55" width="60" height="60" fill="var(--accent)" fill-opacity="0.10" stroke="var(--accent)" stroke-width="1" />
    <rect x="110" y="90" width="80" height="80" fill="var(--accent)" fill-opacity="0.10" stroke="var(--accent)" stroke-width="1" />
    <rect x="160" y="60" width="70" height="70" fill="var(--accent)" fill-opacity="0.10" stroke="var(--accent)" stroke-width="1" />
    <rect x="140" y="100" width="70" height="70" fill="var(--accent)" fill-opacity="0.10" stroke="var(--accent)" stroke-width="1" />
    <rect x="80" y="105" width="65" height="65" fill="var(--accent)" fill-opacity="0.10" stroke="var(--accent)" stroke-width="1" />

    <circle cx="105" cy="85" r="2.5" fill="var(--ink)" />
    <circle cx="150" cy="130" r="2.5" fill="var(--ink)" />
    <circle cx="195" cy="95" r="2.5" fill="var(--ink)" />

    <text x="160" y="195" class="fig-caption-inline" text-anchor="middle">Union of squares covers U₁ × U₂</text>
  </g>
</svg>
