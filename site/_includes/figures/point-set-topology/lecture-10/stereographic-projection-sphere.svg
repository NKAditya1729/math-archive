<svg viewBox="0 0 640 280" role="img" aria-labelledby="t-stereo"
     xmlns="http://www.w3.org/2000/svg" class="fig">
  <title id="t-stereo">Stereographic projection of the punctured sphere S^{n-1} minus P to R^{n-1}</title>

  <!-- Equatorial line H (x_n = 0) at y = 160 -->
  <line x1="60" y1="160" x2="520" y2="160" class="fig-axis" />
  <text x="535" y="164" class="fig-label">H ≅ ℝⁿ⁻¹</text>

  <!-- Hyperplane H' (x_n = 1) at y = 80 (tangent to north pole) -->
  <line x1="120" y1="80" x2="480" y2="80" stroke="var(--ink-soft)" stroke-width="1.2" stroke-dasharray="4 4" />
  <text x="490" y="84" class="fig-tick">H′</text>

  <!-- Vertical axis (x_n) -->
  <line x1="300" y1="50" x2="300" y2="260" class="fig-tick" stroke-dasharray="3 3" />
  <text x="305" y="60" class="fig-tick">x_n</text>

  <!-- Circle / Sphere S^{n-1}, centered at (300, 160) with radius 80 -->
  <circle cx="300" cy="160" r="80" stroke="var(--ink)" stroke-width="2" fill="none" />
  <text x="215" y="145" class="fig-label">Sⁿ⁻¹</text>

  <!-- North Pole P at (300, 80) -->
  <circle cx="300" cy="80" r="4.5" fill="var(--ink)" />
  <text x="285" y="72" class="fig-label" text-anchor="end">P</text>

  <!-- Northern hemisphere ray: P through x to Q outside on H -->
  <line x1="300" y1="80" x2="494" y2="160" stroke="var(--accent)" stroke-width="1.8" />
  <circle cx="357" cy="103" r="4" fill="var(--ink)" />
  <text x="350" y="95" class="fig-label">x</text>

  <!-- Point Q on H (Focal) -->
  <circle cx="494" cy="160" r="4.5" fill="var(--accent)" />
  <text x="494" y="185" class="fig-focus" text-anchor="middle">Q = φ(x)</text>
</svg>
