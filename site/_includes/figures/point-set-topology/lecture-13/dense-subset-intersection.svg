<svg viewBox="0 0 640 240" role="img" aria-labelledby="t-dense"
     xmlns="http://www.w3.org/2000/svg" class="fig">
  <title id="t-dense">A is dense in its closure cl(A): every non-empty open set V in cl(A) meets A</title>

  <!-- Ambient Space X -->
  <rect x="20" y="20" width="600" height="200" rx="8" fill="var(--paper)" stroke="var(--rule)" stroke-width="1.5" />
  <text x="35" y="45" class="fig-label">X</text>

  <!-- Closure cl(A) (Focal) -->
  <ellipse cx="260" cy="120" rx="190" ry="85" class="fig-region" />
  <text x="110" y="75" class="fig-focus">cl(A)</text>

  <!-- Subset A -->
  <ellipse cx="230" cy="130" rx="120" ry="50" fill="var(--accent)" fill-opacity="0.12" stroke="var(--accent)" stroke-width="1.5" stroke-dasharray="4 4" />
  <text x="160" y="140" class="fig-label">A</text>

  <!-- Open set U in X -->
  <circle cx="340" cy="100" r="60" fill="var(--ink-soft)" fill-opacity="0.06" stroke="var(--ink-soft)" stroke-width="1.5" stroke-dasharray="4 3" />
  <text x="385" y="55" class="fig-label">U</text>

  <!-- Subspace open set V = U cap cl(A) -->
  <text x="385" y="115" class="fig-tick">V = U ∩ cl(A)</text>

  <!-- Point x in V -->
  <circle cx="330" cy="95" r="3.5" fill="var(--ink)" />
  <text x="320" y="90" class="fig-label">x</text>

  <!-- Point in V cap A -->
  <circle cx="300" cy="120" r="3.5" fill="var(--accent)" />
  <text x="290" y="140" class="fig-tick">V ∩ A</text>
</svg>
