<svg viewBox="0 0 660 250" role="img" aria-labelledby="t-paste"
     xmlns="http://www.w3.org/2000/svg" class="fig">
  <title id="t-paste">The Pasting Lemma: gluing continuous maps on two closed sets meeting along an interface</title>
  <defs>
    <marker id="arr-paste" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <polygon points="0 0, 7 3.5, 0 7" fill="var(--ink)" />
    </marker>
  </defs>

  <!-- Domain X = A cup B -->
  <g transform="translate(20, 20)">
    <!-- Piece A -->
    <path d="M 10,20 L 150,20 L 150,190 L 10,190 Z" fill="var(--accent)" fill-opacity="0.12" stroke="var(--accent)" stroke-width="2" />
    <text x="80" y="50" class="fig-label" text-anchor="middle">A</text>

    <!-- Piece B -->
    <path d="M 150,20 L 290,20 L 290,190 L 150,190 Z" fill="var(--ink-soft)" fill-opacity="0.08" stroke="var(--ink-soft)" stroke-width="2" />
    <text x="220" y="50" class="fig-label" text-anchor="middle">B</text>

    <!-- Interface A cap B (Focal) -->
    <line x1="150" y1="20" x2="150" y2="190" stroke="var(--ink)" stroke-width="3" />
    <text x="150" y="215" class="fig-focus" text-anchor="middle">A ∩ B</text>
    <text x="150" y="12" class="fig-caption-inline" text-anchor="middle">X = A ∪ B</text>
  </g>

  <!-- Mapping arrow f -->
  <line x1="330" y1="105" x2="430" y2="105" class="fig-axis" marker-end="url(#arr-paste)" />
  <text x="380" y="95" class="fig-label" text-anchor="middle">f</text>

  <!-- Codomain Y -->
  <g transform="translate(450, 20)">
    <rect x="0" y="20" width="180" height="170" fill="var(--paper)" stroke="var(--rule)" stroke-width="1.5" rx="6" />
    <text x="20" y="45" class="fig-label">Y</text>

    <!-- Closed set Z in Y -->
    <rect x="25" y="65" width="130" height="90" rx="4" fill="var(--flag)" fill-opacity="0.15" stroke="var(--flag)" stroke-width="1.8" />
    <text x="90" y="115" class="fig-fail" text-anchor="middle">Z ⊆ Y</text>
  </g>
</svg>
