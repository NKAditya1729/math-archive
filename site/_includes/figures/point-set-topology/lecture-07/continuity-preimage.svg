<svg viewBox="0 0 560 260" role="img" aria-labelledby="fig-cont-preimage-title"
     xmlns="http://www.w3.org/2000/svg" class="fig">
  <title id="fig-cont-preimage-title">Topological continuity: a map f between spaces X and Y is continuous if and only if the preimage of every open set V in Y is open in X.</title>
  <defs>
    <marker id="arrow-map" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="var(--ink)" />
    </marker>
  </defs>

  <!-- Left Space: X -->
  <rect x="30" y="30" width="200" height="190" rx="10" stroke="var(--ink-soft)" stroke-width="1.5" stroke-dasharray="5 4" fill="none" />
  <text x="50" y="55" class="fig-label">X</text>

  <!-- Preimage f^{-1}(V) in X (Focal) -->
  <ellipse cx="130" cy="135" rx="55" ry="45" class="fig-region" stroke-dasharray="4 3" />
  <text x="130" y="140" class="fig-focus" text-anchor="middle">f⁻¹(V)</text>

  <!-- Right Space: Y -->
  <rect x="330" y="30" width="200" height="190" rx="10" stroke="var(--ink-soft)" stroke-width="1.5" stroke-dasharray="5 4" fill="none" />
  <text x="350" y="55" class="fig-label">Y</text>

  <!-- Open set V in Y -->
  <ellipse cx="430" cy="135" rx="55" ry="45" fill="var(--accent)" fill-opacity="0.12" stroke="var(--accent)" stroke-width="1.5" stroke-dasharray="4 3" />
  <text x="430" y="140" class="fig-label" text-anchor="middle">V</text>

  <!-- Mapping Arrow f: X -> Y -->
  <line x1="240" y1="120" x2="315" y2="120" class="fig-axis" marker-end="url(#arrow-map)" />
  <text x="277" y="110" class="fig-label" text-anchor="middle">f</text>
</svg>
