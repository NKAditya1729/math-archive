<svg viewBox="0 0 540 270" role="img" aria-labelledby="fig-proj-cyl-title"
     xmlns="http://www.w3.org/2000/svg" class="fig">
  <title id="fig-proj-cyl-title">Open cylinder as projection preimage: the preimage p_j^{-1}(U) of an open set U in coordinate space X_j is an open cylinder restricting only the j-th factor.</title>
  <defs>
    <marker id="arrow-proj" viewBox="0 0 10 10" refX="5" refY="8" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 1 2 L 5 8 L 9 2 z" fill="var(--ink)" />
    </marker>
  </defs>

  <!-- Product Space Frame -->
  <rect x="50" y="25" width="440" height="150" rx="8" stroke="var(--ink-soft)" stroke-width="1.5" stroke-dasharray="5 4" fill="none" />
  <text x="70" y="50" class="fig-label">∏_{i ∈ I} X_i</text>

  <!-- Open cylinder: vertical strip where j-th coordinate is in U (Focal) -->
  <rect x="220" y="25" width="100" height="150" class="fig-region" stroke-dasharray="4 3" />
  <text x="270" y="105" class="fig-focus" text-anchor="middle">p_j⁻¹(U)</text>

  <!-- Projection Arrow down to coordinate space X_j -->
  <line x1="270" y1="185" x2="270" y2="215" class="fig-axis" marker-end="url(#arrow-proj)" />
  <text x="285" y="205" class="fig-label">p_j</text>

  <!-- Coordinate space X_j axis -->
  <line x1="50" y1="235" x2="490" y2="235" class="fig-axis" />
  <text x="505" y="240" class="fig-label">X_j</text>

  <!-- Target open set U on X_j axis -->
  <line x1="220" y1="235" x2="320" y2="235" stroke="var(--accent)" stroke-width="4" stroke-linecap="round" />
  <text x="270" y="255" class="fig-tick" text-anchor="middle">U</text>
</svg>
