<svg viewBox="0 0 540 260" role="img" aria-labelledby="fig-proj-cyl-title"
     xmlns="http://www.w3.org/2000/svg" class="fig">
  <title id="fig-proj-cyl-title">Coordinate projection and cylinder sets: the preimage p_j^{-1}(U) restricts only the j-th coordinate, leaving all other coordinates unconstrained.</title>
  <style>
    .axis { stroke: var(--ink); stroke-width: 1.5; }
    .strip { stroke: var(--accent); stroke-width: 1.5; stroke-dasharray: 4 3; fill: var(--accent); fill-opacity: 0.15; }
    .arrow { stroke: var(--ink); stroke-width: 1.5; fill: none; }
    .label { font-family: 'Source Serif 4', Georgia, serif; font-size: 15px; fill: var(--ink); text-anchor: middle; }
    .label-italic { font-family: 'Source Serif 4', Georgia, serif; font-size: 15px; font-style: italic; fill: var(--ink); text-anchor: middle; }
    .label-accent { font-family: 'Source Serif 4', Georgia, serif; font-size: 14px; font-style: italic; fill: var(--accent); font-weight: 600; text-anchor: middle; }
  </style>

  <!-- Background -->
  <rect width="540" height="260" fill="var(--paper)" />

  <!-- Axes for Product Space: horizontal X_j, vertical \prod_{i \ne j} X_i -->
  <line x1="60" y1="200" x2="380" y2="200" class="axis" />
  <polygon points="380,196 390,200 380,204" fill="var(--ink)" />
  <text x="405" y="205" class="label-italic">X_j</text>

  <line x1="80" y1="220" x2="80" y2="30" class="axis" />
  <polygon points="76,30 80,20 84,30" fill="var(--ink)" />
  <text x="80" y="15" class="label-italic">∏_{i ≠ j} X_i</text>

  <!-- Strip p_j^{-1}(U): vertical band from x=170 to 270, spanning all y from 35 to 200 -->
  <rect x="170" y="35" width="100" height="165" class="strip" />
  <text x="220" y="115" class="label-accent">p_j⁻¹(U) = U × ∏_{i ≠ j} X_i</text>

  <!-- Target space X_j line below -->
  <line x1="170" y1="200" x2="270" y2="200" stroke="var(--accent)" stroke-width="4" stroke-linecap="round" />
  <text x="220" y="225" class="label-accent">U ⊆ X_j</text>

  <!-- Projection Arrow downwards -->
  <path d="M 430,90 C 460,120 460,160 430,190" class="arrow" />
  <polygon points="426,183 425,193 434,191" fill="var(--ink)" />
  <text x="475" y="145" class="label-italic" style="font-weight: bold;">p_j</text>

  <text x="270" y="250" class="label">Preimage of open set U in X_j is an open cylinder in the product topology.</text>
</svg>
