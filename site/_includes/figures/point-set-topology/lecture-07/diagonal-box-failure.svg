<svg viewBox="0 0 560 250" role="img" aria-labelledby="fig-diag-box-title"
     xmlns="http://www.w3.org/2000/svg" class="fig">
  <title id="fig-diag-box-title">Failure of continuity of the diagonal map in the box topology: the preimage of the box open set prod (-1/n, 1/n) is the singleton {0}, which is not open in the standard topology on R.</title>
  <style>
    .axis { stroke: var(--ink); stroke-width: 1.5; }
    .interval { stroke: var(--accent); stroke-width: 2.5; stroke-linecap: round; }
    .box-rect { stroke: var(--accent); stroke-width: 1.5; stroke-dasharray: 4 3; fill: var(--accent); fill-opacity: 0.12; }
    .point-zero { fill: var(--accent); }
    .arrow { stroke: var(--ink); stroke-width: 1.5; fill: none; }
    .label { font-family: 'Source Serif 4', Georgia, serif; font-size: 15px; fill: var(--ink); text-anchor: middle; }
    .label-italic { font-family: 'Source Serif 4', Georgia, serif; font-size: 15px; font-style: italic; fill: var(--ink); text-anchor: middle; }
    .label-accent { font-family: 'Source Serif 4', Georgia, serif; font-size: 14px; font-style: italic; fill: var(--accent); font-weight: 600; text-anchor: middle; }
    .label-soft { font-family: 'Source Serif 4', Georgia, serif; font-size: 13px; font-style: italic; fill: var(--ink-soft); text-anchor: middle; }
  </style>

  <!-- Background -->
  <rect width="560" height="250" fill="var(--paper)" />

  <!-- Domain Real Line (Left) -->
  <line x1="30" y1="130" x2="230" y2="130" class="axis" />
  <polygon points="230,126 240,130 230,134" fill="var(--ink)" />
  <text x="130" y="35" class="label" style="font-weight: 600;">Domain: ℝ (Standard)</text>

  <!-- Point 0 on Domain -->
  <circle cx="130" cy="130" r="5" class="point-zero" />
  <text x="130" y="155" class="label-accent">0</text>
  <text x="130" y="180" class="label-accent">Δ⁻¹(U) = {0}</text>
  <text x="130" y="200" class="label-soft" style="color: var(--accent); font-weight: 600;">(NOT open in ℝ!)</text>

  <!-- Arrow Delta -->
  <path d="M 235,115 C 265,100 285,100 315,115" class="arrow" />
  <polygon points="315,110 323,118 313,120" fill="var(--ink)" />
  <text x="275" y="95" class="label-italic" style="font-weight: bold;">Δ</text>

  <!-- Target Infinite Product (Right) -->
  <text x="430" y="35" class="label" style="font-weight: 600;">Codomain: ∏_{n=1}^∞ ℝ (Box)</text>

  <!-- Depicting coordinate shrinking intervals -->
  <!-- n = 1: (-1, 1) -->
  <line x1="340" y1="75" x2="520" y2="75" class="interval" />
  <text x="430" y="68" class="label-soft">n = 1 :  (−1, 1)</text>

  <!-- n = 2: (-1/2, 1/2) -->
  <line x1="385" y1="110" x2="475" y2="110" class="interval" />
  <text x="430" y="103" class="label-soft">n = 2 :  (−½, ½)</text>

  <!-- n = 3: (-1/3, 1/3) -->
  <line x1="400" y1="145" x2="460" y2="145" class="interval" />
  <text x="430" y="138" class="label-soft">n = 3 :  (−⅓, ⅓)</text>

  <!-- Shrinking to 0 -->
  <text x="430" y="175" class="label">⋮</text>
  <text x="430" y="200" class="label-accent">U = ∏_{n=1}^∞ (−¹⁄ₙ, ¹⁄ₙ) ∈ τ_{box}</text>

  <text x="280" y="238" class="label">Preimage is ⋂_{n=1}^∞ (−¹⁄ₙ, ¹⁄ₙ) = {0}, proving Δ is not box-continuous.</text>
</svg>
