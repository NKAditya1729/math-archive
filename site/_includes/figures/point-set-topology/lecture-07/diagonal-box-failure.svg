<svg viewBox="0 0 560 260" role="img" aria-labelledby="fig-diag-box-title"
     xmlns="http://www.w3.org/2000/svg" class="fig">
  <title id="fig-diag-box-title">Failure of continuity into the box topology: the diagonal map delta into the countable product of real lines pulls back a basic box-open set to the singleton {0}, which is not open in R.</title>
  <defs>
    <marker id="arrow-diag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="var(--ink)" />
    </marker>
  </defs>

  <!-- Left: Domain R -->
  <text x="120" y="32" class="fig-label" text-anchor="middle">Domain ℝ</text>
  <rect x="25" y="45" width="190" height="190" rx="8" stroke="var(--ink-soft)" stroke-width="1.5" stroke-dasharray="5 4" fill="none" />

  <!-- Real line -->
  <line x1="40" y1="140" x2="200" y2="140" class="fig-axis" />
  <!-- Origin point {0} = Delta^{-1}(U) (Focal Failure) -->
  <circle cx="120" cy="140" r="5" fill="var(--flag)" stroke="var(--flag)" />
  <text x="120" y="165" class="fig-fail" text-anchor="middle">Δ⁻¹(U) = {0}</text>
  <text x="120" y="185" class="fig-caption-inline" text-anchor="middle">not open in ℝ</text>

  <!-- Mapping Arrow Delta -->
  <line x1="225" y1="130" x2="295" y2="130" class="fig-axis" marker-end="url(#arrow-diag)" />
  <text x="260" y="120" class="fig-label" text-anchor="middle">Δ</text>

  <!-- Right: Codomain Box Product -->
  <text x="410" y="32" class="fig-label" text-anchor="middle">Box product ∏ ℝ</text>
  <rect x="315" y="45" width="220" height="190" rx="8" stroke="var(--ink-soft)" stroke-width="1.5" stroke-dasharray="5 4" fill="none" />

  <!-- Coordinate factors: n=1, 2, 3 -->
  <line x1="335" y1="85" x2="515" y2="85" class="fig-tick" />
  <line x1="385" y1="85" x2="465" y2="85" stroke="var(--accent)" stroke-width="3" stroke-linecap="round" />
  <text x="525" y="89" class="fig-tick">n=1</text>

  <line x1="335" y1="120" x2="515" y2="120" class="fig-tick" />
  <line x1="405" y1="120" x2="445" y2="120" stroke="var(--accent)" stroke-width="3" stroke-linecap="round" />
  <text x="525" y="124" class="fig-tick">n=2</text>

  <line x1="335" y1="155" x2="515" y2="155" class="fig-tick" />
  <line x1="415" y1="155" x2="435" y2="155" stroke="var(--accent)" stroke-width="3" stroke-linecap="round" />
  <text x="525" y="159" class="fig-tick">n=3</text>

  <text x="425" y="185" class="fig-caption-inline" text-anchor="middle">⋮ (shrinking intervals)</text>
  <text x="425" y="215" class="fig-tick" text-anchor="middle">U = ∏ (−¹⁄ₙ, ¹⁄ₙ)</text>
</svg>
