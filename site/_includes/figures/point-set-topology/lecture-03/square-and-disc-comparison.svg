<svg viewBox="0 0 640 290" role="img" aria-labelledby="fig-square-disc-title"
     xmlns="http://www.w3.org/2000/svg" class="fig">
  <title id="fig-square-disc-title">Comparison of open squares and open balls around the same point: every open square contains a smaller concentric open ball, and every open ball contains a smaller concentric open square, proving that tau = tau'.</title>
  <style>
    .outer-shape { stroke: var(--ink-soft); stroke-width: 2; stroke-dasharray: 6 4; fill: var(--ink-soft); fill-opacity: 0.08; }
    .inner-shape { stroke: var(--accent); stroke-width: 2.5; stroke-dasharray: 4 3; fill: var(--accent); fill-opacity: 0.20; }
    .divider { stroke: var(--rule); stroke-width: 1; stroke-dasharray: 4 4; }
    .label { font-family: 'Source Serif 4', Georgia, serif; font-size: 15px; fill: var(--ink); text-anchor: middle; }
    .label-italic { font-family: 'Source Serif 4', Georgia, serif; font-size: 15px; font-style: italic; fill: var(--ink); text-anchor: middle; }
    .label-accent { font-family: 'Source Serif 4', Georgia, serif; font-size: 14px; font-style: italic; fill: var(--accent); font-weight: 600; text-anchor: middle; }
    .label-soft { font-family: 'Source Serif 4', Georgia, serif; font-size: 13px; font-style: italic; fill: var(--ink-soft); text-anchor: middle; }
    .heading { font-family: 'Source Serif 4', Georgia, serif; font-size: 14px; font-weight: 600; fill: var(--ink); text-anchor: middle; }
  </style>

  <!-- Background -->
  <rect width="640" height="290" fill="var(--paper)" />

  <!-- Panel Divider -->
  <line x1="320" y1="25" x2="320" y2="265" class="divider" />

  <!-- LEFT PANEL: Ball inside Square (S_eps contains B_eps') -->
  <!-- Center at (160, 140) -->
  <text x="160" y="32" class="heading">Ball inside Square</text>

  <!-- Outer Square: half-width eps = 70 px (140x140) from x=90 to 230, y=70 to 210 -->
  <rect x="90" y="70" width="140" height="140" class="outer-shape" />

  <!-- Inscribed Ball: radius eps' = 70 px (tangent to edges) -->
  <circle cx="160" cy="140" r="70" class="inner-shape" />

  <!-- Center point x -->
  <circle cx="160" cy="140" r="4" fill="var(--ink)" />
  <text x="160" y="160" class="label-italic" style="font-weight: bold;">x</text>

  <!-- Labels for left panel -->
  <text x="160" y="235" class="label-accent">B_{ε'}(x) ⊆ S_ε(x)</text>
  <text x="160" y="255" class="label-soft">with ε' = ε</text>

  <!-- RIGHT PANEL: Square inside Ball (B_eps contains S_eps') -->
  <!-- Center at (480, 140) -->
  <text x="480" y="32" class="heading">Square inside Ball (n = 2)</text>

  <!-- Outer Ball: radius eps = 70 px -->
  <circle cx="480" cy="140" r="70" class="outer-shape" />

  <!-- Inscribed Square: half-width eps' = 70 / sqrt(2) ≈ 49.5 px -> side length 99 px -->
  <rect x="430.5" y="90.5" width="99" height="99" class="inner-shape" />

  <!-- Center point x -->
  <circle cx="480" cy="140" r="4" fill="var(--ink)" />
  <text x="480" y="160" class="label-italic" style="font-weight: bold;">x</text>

  <!-- Labels for right panel -->
  <text x="480" y="235" class="label-accent">S_{ε'}(x) ⊆ B_ε(x)</text>
  <text x="480" y="255" class="label-soft">with ε' = ε / √2 (case n = 2)</text>
</svg>
