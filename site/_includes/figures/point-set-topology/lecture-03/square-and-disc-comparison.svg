<svg viewBox="0 0 640 290" role="img" aria-labelledby="fig-square-disc-title"
     xmlns="http://www.w3.org/2000/svg" class="fig">
  <title id="fig-square-disc-title">Comparison of open squares and open balls around the same point: every open square contains a smaller concentric open ball, and every open ball contains a smaller concentric open square, proving that tau = tau'.</title>

  <!-- Panel Divider -->
  <line x1="320" y1="25" x2="320" y2="265" class="fig-tick" stroke-dasharray="4 4" />

  <!-- LEFT PANEL: Ball inside Square -->
  <text x="160" y="35" class="fig-label" text-anchor="middle">Ball inside square</text>

  <!-- Outer Square: 140x140 from x=90 to 230, y=65 to 205 -->
  <rect x="90" y="65" width="140" height="140" fill="var(--ink-soft)" fill-opacity="0.06" stroke="var(--ink-soft)" stroke-width="1.5" stroke-dasharray="6 4" />

  <!-- Inscribed Ball: radius eps' = 70 px (Focal left) -->
  <circle cx="160" cy="135" r="70" class="fig-region" stroke-dasharray="4 3" />

  <!-- Center point x -->
  <circle cx="160" cy="135" r="4" fill="var(--ink)" />
  <text x="160" y="155" class="fig-label" text-anchor="middle">x</text>

  <!-- Inclusions for left panel -->
  <text x="160" y="240" class="fig-focus" text-anchor="middle">B_{ε′}(x) ⊆ S_ε(x)</text>

  <!-- RIGHT PANEL: Square inside Ball -->
  <text x="480" y="35" class="fig-label" text-anchor="middle">Square inside ball</text>

  <!-- Outer Ball: radius eps = 70 px -->
  <circle cx="480" cy="135" r="70" fill="var(--ink-soft)" fill-opacity="0.06" stroke="var(--ink-soft)" stroke-width="1.5" stroke-dasharray="6 4" />

  <!-- Inscribed Square: side length 99 px -->
  <rect x="430.5" y="85.5" width="99" height="99" class="fig-region" stroke-dasharray="4 3" />

  <!-- Center point x -->
  <circle cx="480" cy="135" r="4" fill="var(--ink)" />
  <text x="480" y="155" class="fig-label" text-anchor="middle">x</text>

  <!-- Inclusions for right panel -->
  <text x="480" y="240" class="fig-focus" text-anchor="middle">S_{ε′}(x) ⊆ B_ε(x)</text>
</svg>
