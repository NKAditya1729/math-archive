<svg viewBox="0 0 640 320" role="img" aria-labelledby="fig-region-square-title"
     xmlns="http://www.w3.org/2000/svg" class="fig">
  <title id="fig-region-square-title">A region U_i in the plane satisfying property (*), showing an interior point (a,b) surrounded by an open square S_{epsilon_i}(a,b) that fits entirely inside U_i.</title>

  <!-- Organic region U_i in R^2 -->
  <path d="M 140 160 C 140 70, 240 50, 360 60 C 480 70, 520 120, 510 200 C 500 270, 390 280, 280 270 C 180 260, 140 220, 140 160 Z" class="fig-region" stroke-dasharray="6 4" />

  <!-- Label for U_i placed safely inside blob (Focal) -->
  <text x="210" y="110" class="fig-focus">U_i</text>

  <!-- Square S_{eps_i}(a,b) with side length 80 px (eps_i = 40 px) from x=270 to 350, y=125 to 205 -->
  <rect x="270" y="125" width="80" height="80" fill="var(--accent)" fill-opacity="0.25" stroke="var(--accent)" stroke-width="2" stroke-dasharray="4 3" />

  <!-- Center point (a,b) -->
  <circle cx="310" cy="165" r="4.5" fill="var(--ink)" />
  <text x="310" y="185" class="fig-label" text-anchor="middle">(a, b)</text>

  <!-- Callout for square -->
  <path d="M 350 140 L 410 115 L 440 115" fill="none" stroke="var(--accent)" stroke-width="1.2" />
  <text x="445" y="119" class="fig-tick">S_{ε_i}(a, b) ⊆ U_i</text>
</svg>
