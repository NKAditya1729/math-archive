<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 280" width="100%" height="280" aria-label="Four-step path in GL_n(R)+ connecting matrix A to the identity matrix">
  <!-- Region GL_n(R)+ -->
  <path class="fig-region" d="M 60,140 C 70,50 180,40 320,45 C 440,50 480,100 460,210 C 440,260 320,260 180,250 C 90,240 50,200 60,140 Z" fill="var(--accent)" fill-opacity="0.12" stroke="var(--ink-soft)" stroke-width="1.5" />
  <text class="fig-label" x="80" y="75" fill="var(--ink-soft)" font-size="16" font-style="italic">GL_n(R)⁺</text>

  <!-- Multi-step path: A -> B -> C -> C' -> I -->
  <!-- Step 1: A to B -->
  <path class="fig-focus" d="M 110,180 C 130,130 150,140 170,160" fill="none" stroke="var(--accent)" stroke-width="2.5" />
  <!-- Step 2: B to C -->
  <path class="fig-focus" d="M 170,160 C 210,190 230,180 260,140" fill="none" stroke="var(--accent)" stroke-width="2.5" />
  <!-- Step 3: C to C' -->
  <path class="fig-focus" d="M 260,140 C 290,100 320,110 350,150" fill="none" stroke="var(--accent)" stroke-width="2.5" />
  <!-- Step 4: C' to I -->
  <path class="fig-focus" d="M 350,150 C 380,180 400,160 420,120" fill="none" stroke="var(--accent)" stroke-width="2.5" />

  <!-- Points -->
  <circle cx="110" cy="180" r="4" fill="var(--ink)" />
  <circle cx="170" cy="160" r="3.5" fill="var(--ink)" />
  <circle cx="260" cy="140" r="3.5" fill="var(--ink)" />
  <circle cx="350" cy="150" r="3.5" fill="var(--ink)" />
  <circle cx="420" cy="120" r="4" fill="var(--ink)" />

  <!-- Labels -->
  <text class="fig-label" x="95" y="195" fill="var(--ink)" font-size="14" font-style="italic">A</text>
  <text class="fig-label" x="162" y="150" fill="var(--ink-soft)" font-size="13" font-style="italic">B</text>
  <text class="fig-label" x="255" y="130" fill="var(--ink-soft)" font-size="13" font-style="italic">C</text>
  <text class="fig-label" x="345" y="172" fill="var(--ink-soft)" font-size="13" font-style="italic">C'</text>
  <text class="fig-focus fig-label" x="428" y="122" fill="var(--accent)" font-size="15" font-weight="bold" font-style="italic">Iₙ</text>

  <!-- Step indicators -->
  <text class="fig-label" x="130" y="135" fill="var(--ink-soft)" font-size="11">step 1</text>
  <text class="fig-label" x="205" y="195" fill="var(--ink-soft)" font-size="11">step 2</text>
  <text class="fig-label" x="295" y="105" fill="var(--ink-soft)" font-size="11">step 3</text>
  <text class="fig-label" x="390" y="180" fill="var(--ink-soft)" font-size="11">induction</text>
</svg>