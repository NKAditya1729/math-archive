<svg viewBox="0 0 500 220" role="img" aria-labelledby="fig-corestrict-title"
     xmlns="http://www.w3.org/2000/svg" class="fig">
  <title id="fig-corestrict-title">Factorization of a map f through its subspace image Y: f = i ∘ f_0.</title>
  <defs>
    <marker id="arr9" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="var(--ink)" />
    </marker>
    <marker id="arr9-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="var(--accent)" />
    </marker>
  </defs>

  <!-- Nodes -->
  <text x="80" y="65" class="fig-label" text-anchor="middle">X</text>
  <text x="420" y="65" class="fig-label" text-anchor="middle">Z</text>
  <text x="250" y="175" class="fig-label" text-anchor="middle">Y</text>

  <!-- Top arrow: X -> Z (f) -->
  <line x1="105" y1="60" x2="395" y2="60" class="fig-axis" marker-end="url(#arr9)" />
  <text x="250" y="48" class="fig-label" text-anchor="middle">f</text>

  <!-- Diagonal arrow: X -> Y (f0) (Focal) -->
  <line x1="98" y1="78" x2="230" y2="158" stroke="var(--accent)" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#arr9-blue)" />
  <text x="148" y="130" class="fig-focus" text-anchor="end">f₀</text>

  <!-- Inclusion arrow: Y -> Z (i) -->
  <line x1="270" y1="158" x2="402" y2="78" class="fig-axis" marker-end="url(#arr9)" />
  <text x="352" y="130" class="fig-label" text-anchor="start">i</text>
</svg>
