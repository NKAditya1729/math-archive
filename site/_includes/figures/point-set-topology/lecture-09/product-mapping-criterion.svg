<svg viewBox="0 0 540 240" role="img" aria-labelledby="fig-prod-map-title"
     xmlns="http://www.w3.org/2000/svg" class="fig">
  <title id="fig-prod-map-title">Universal mapping property of the product: continuity of f into a product space is equivalent to continuity of every coordinate map f_j.</title>
  <defs>
    <marker id="arr-p" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="var(--ink)" />
    </marker>
    <marker id="arr-p-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="var(--accent)" />
    </marker>
  </defs>

  <!-- Nodes -->
  <!-- X at (80, 110) -->
  <text x="80" y="116" class="fig-label" text-anchor="middle">X</text>

  <!-- Product space at (360, 60) -->
  <text x="360" y="66" class="fig-label" text-anchor="middle">∏_{i ∈ I} Y_i</text>

  <!-- Target factor Y_j at (360, 180) -->
  <text x="360" y="186" class="fig-label" text-anchor="middle">Y_j</text>

  <!-- Diagonal up: f : X -> Prod Y_i (Focal) -->
  <line x1="105" y1="100" x2="285" y2="68" stroke="var(--accent)" stroke-width="2" marker-end="url(#arr-p-blue)" />
  <text x="185" y="74" class="fig-focus" text-anchor="middle">f = (f_i)_{i ∈ I}</text>

  <!-- Vertical down: p_j : Prod Y_i -> Y_j -->
  <line x1="360" y1="80" x2="360" y2="160" class="fig-axis" marker-end="url(#arr-p)" />
  <text x="375" y="125" class="fig-tick">p_j</text>

  <!-- Horizontal / diagonal: f_j : X -> Y_j -->
  <line x1="105" y1="120" x2="335" y2="175" class="fig-axis" marker-end="url(#arr-p)" />
  <text x="210" y="165" class="fig-tick" text-anchor="middle">f_j = p_j ∘ f</text>
</svg>
