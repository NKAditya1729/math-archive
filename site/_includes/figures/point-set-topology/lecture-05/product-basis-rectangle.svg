<svg viewBox="0 0 540 280" role="img" aria-labelledby="fig-prod-rect-title"
     xmlns="http://www.w3.org/2000/svg" class="fig">
  <title id="fig-prod-rect-title">Product topology basis: the intersection of two basic open rectangles W_1 = U_1 × V_1 and W_2 = U_2 × V_2 is precisely the basic open rectangle (U_1 ∩ U_2) × (V_1 ∩ V_2).</title>
  <style>
    .axis { stroke: var(--ink); stroke-width: 1.5; }
    .rect-1 { stroke: var(--ink-soft); stroke-width: 1.5; stroke-dasharray: 5 4; fill: var(--ink-soft); fill-opacity: 0.08; }
    .rect-2 { stroke: var(--ink-soft); stroke-width: 1.5; stroke-dasharray: 5 4; fill: var(--ink-soft); fill-opacity: 0.08; }
    .rect-int { stroke: var(--accent); stroke-width: 2; stroke-dasharray: 4 3; fill: var(--accent); fill-opacity: 0.22; }
    .label { font-family: 'Source Serif 4', Georgia, serif; font-size: 15px; fill: var(--ink); text-anchor: middle; }
    .label-italic { font-family: 'Source Serif 4', Georgia, serif; font-size: 15px; font-style: italic; fill: var(--ink); text-anchor: middle; }
    .label-accent { font-family: 'Source Serif 4', Georgia, serif; font-size: 14px; font-style: italic; fill: var(--accent); font-weight: 600; text-anchor: middle; }
    .label-axis { font-family: 'Source Serif 4', Georgia, serif; font-size: 14px; font-style: italic; fill: var(--ink-soft); text-anchor: middle; }
  </style>

  <!-- Background -->
  <rect width="540" height="280" fill="var(--paper)" />

  <!-- Axes: X horizontal at y = 230, Y vertical at x = 70 -->
  <line x1="50" y1="230" x2="490" y2="230" class="axis" />
  <polygon points="490,226 500,230 490,234" fill="var(--ink)" />
  <text x="510" y="235" class="label-italic">X</text>

  <line x1="70" y1="250" x2="70" y2="30" class="axis" />
  <polygon points="66,30 70,20 74,30" fill="var(--ink)" />
  <text x="70" y="15" class="label-italic">Y</text>

  <!-- Rectangle W_1 = U_1 x V_1: x in [130, 350], y in [70, 190] -->
  <rect x="130" y="70" width="220" height="120" class="rect-1" />
  <text x="175" y="60" class="label-italic">W_1 = U_1 × V_1</text>

  <!-- Rectangle W_2 = U_2 x V_2: x in [220, 430], y in [110, 210] -->
  <rect x="220" y="110" width="210" height="100" class="rect-2" />
  <text x="385" y="100" class="label-italic">W_2 = U_2 × V_2</text>

  <!-- Intersection: x in [220, 350], y in [110, 190] (width 130, height 80) -->
  <rect x="220" y="110" width="130" height="80" class="rect-int" />

  <!-- Point (a,b) in intersection at (275, 150) -->
  <circle cx="275" cy="150" r="4" fill="var(--ink)" />
  <text x="295" y="145" class="label-italic" style="font-weight: bold;">(a, b)</text>

  <!-- Projected intervals on X axis -->
  <line x1="220" y1="230" x2="350" y2="230" stroke="var(--accent)" stroke-width="3.5" stroke-linecap="round" />
  <text x="285" y="250" class="label-accent">U_1 ∩ U_2</text>

  <!-- Projected intervals on Y axis -->
  <line x1="70" y1="110" x2="70" y2="190" stroke="var(--accent)" stroke-width="3.5" stroke-linecap="round" />
  <text x="35" y="155" class="label-accent">V_1 ∩ V_2</text>

  <!-- Bottom description -->
  <text x="285" y="272" class="label">W_1 ∩ W_2 = (U_1 ∩ U_2) × (V_1 ∩ V_2) ∈ ℬ</text>
</svg>
