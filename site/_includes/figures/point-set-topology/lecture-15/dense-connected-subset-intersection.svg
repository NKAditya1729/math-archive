<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 250" width="100%" height="auto">
  <!-- Disjoint open sets U1 and U2 forming X -->
  <path d="M 40 125 C 40 60, 90 45, 170 50 C 215 55, 220 195, 170 205 C 90 210, 40 190, 40 125 Z" class="fig-region" stroke-width="1.5" />
  <path d="M 240 125 C 240 55, 290 50, 380 45 C 420 60, 420 190, 380 205 C 290 210, 240 195, 240 125 Z" class="fig-region" stroke-width="1.5" />

  <!-- Dense connected subset U spanning across -->
  <path d="M 100 125 C 100 95, 200 85, 270 95 C 340 105, 360 145, 330 160 C 250 175, 120 155, 100 125 Z" class="fig-region" stroke="var(--accent)" stroke-width="1.8" stroke-dasharray="5,4" />

  <!-- Labels -->
  <text x="75" y="75" class="fig-label" text-anchor="middle">U₁</text>
  <text x="385" y="75" class="fig-label" text-anchor="middle">U₂</text>
  <text x="230" y="80" class="fig-focus" text-anchor="middle">U</text>

  <text x="145" y="130" class="fig-tick" text-anchor="middle">U ∩ U₁</text>
  <text x="315" y="130" class="fig-tick" text-anchor="middle">U ∩ U₂</text>
</svg>
