<svg viewBox="0 0 540 180" role="img" aria-labelledby="fig-z-subspace-title"
     xmlns="http://www.w3.org/2000/svg" class="fig">
  <title id="fig-z-subspace-title">The subspace topology on Z as a subset of R is discrete: the open interval (n - 1/2, n + 1/2) contains no integer other than n, isolating the singleton {n}.</title>
  <style>
    .axis { stroke: var(--ink); stroke-width: 1.5; }
    .interval { stroke: var(--accent); stroke-width: 4; stroke-linecap: round; }
    .end-pt { stroke: var(--accent); stroke-width: 2; fill: var(--paper); }
    .int-pt { fill: var(--ink); }
    .iso-pt { fill: var(--accent); }
    .label { font-family: 'Source Serif 4', Georgia, serif; font-size: 15px; fill: var(--ink); text-anchor: middle; }
    .label-italic { font-family: 'Source Serif 4', Georgia, serif; font-size: 15px; font-style: italic; fill: var(--ink); text-anchor: middle; }
    .label-accent { font-family: 'Source Serif 4', Georgia, serif; font-size: 14px; font-style: italic; fill: var(--accent); font-weight: 600; text-anchor: middle; }
  </style>

  <!-- Background -->
  <rect width="540" height="180" fill="var(--paper)" />

  <!-- Real Line Axis -->
  <line x1="40" y1="90" x2="500" y2="90" class="axis" />
  <polygon points="500,86 510,90 500,94" fill="var(--ink)" />
  <polygon points="40,86 30,90 40,94" fill="var(--ink)" />
  <text x="515" y="95" class="label-italic">ℝ</text>

  <!-- Integer positions: n-2 at 80, n-1 at 170, n at 260, n+1 at 350, n+2 at 440 -->
  <!-- Other integer points -->
  <circle cx="80" cy="90" r="5" class="int-pt" />
  <text x="80" y="125" class="label-italic">n − 2</text>

  <circle cx="170" cy="90" r="5" class="int-pt" />
  <text x="170" y="125" class="label-italic">n − 1</text>

  <circle cx="350" cy="90" r="5" class="int-pt" />
  <text x="350" y="125" class="label-italic">n + 1</text>

  <circle cx="440" cy="90" r="5" class="int-pt" />
  <text x="440" y="125" class="label-italic">n + 2</text>

  <!-- Open interval (n - 1/2, n + 1/2): from 215 to 305 -->
  <line x1="215" y1="90" x2="305" y2="90" class="interval" />
  <circle cx="215" cy="90" r="4.5" class="end-pt" />
  <circle cx="305" cy="90" r="4.5" class="end-pt" />

  <!-- The isolated integer point n -->
  <circle cx="260" cy="90" r="5.5" class="iso-pt" />
  <text x="260" y="125" class="label-italic" style="font-weight: bold; fill: var(--accent);">n</text>

  <!-- Labels for interval endpoints -->
  <text x="215" y="65" class="label-accent">n − ½</text>
  <text x="305" y="65" class="label-accent">n + ½</text>

  <!-- Main descriptive label -->
  <text x="260" y="32" class="label">(n − ½, n + ½) ∩ ℤ = {n}</text>
  <text x="260" y="160" class="label">Every singleton {n} is open in the subspace topology, so τ_ℤ is discrete.</text>
</svg>
