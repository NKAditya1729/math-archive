<svg viewBox="0 0 540 180" role="img" aria-labelledby="fig-z-subspace-title"
     xmlns="http://www.w3.org/2000/svg" class="fig">
  <title id="fig-z-subspace-title">The subspace topology on Z as a subset of R is discrete: the open interval (n - 1/2, n + 1/2) contains no integer other than n, isolating the singleton {n}.</title>

  <!-- Real Line Axis -->
  <line x1="40" y1="90" x2="500" y2="90" class="fig-axis" />
  <polygon points="500,86 510,90 500,94" fill="var(--ink)" />
  <polygon points="40,86 30,90 40,94" fill="var(--ink)" />
  <text x="515" y="95" class="fig-label">ℝ</text>

  <!-- Other integer points -->
  <circle cx="80" cy="90" r="4.5" fill="var(--ink)" />
  <text x="80" y="125" class="fig-tick" text-anchor="middle">n − 2</text>

  <circle cx="170" cy="90" r="4.5" fill="var(--ink)" />
  <text x="170" y="125" class="fig-tick" text-anchor="middle">n − 1</text>

  <circle cx="350" cy="90" r="4.5" fill="var(--ink)" />
  <text x="350" y="125" class="fig-tick" text-anchor="middle">n + 1</text>

  <circle cx="440" cy="90" r="4.5" fill="var(--ink)" />
  <text x="440" y="125" class="fig-tick" text-anchor="middle">n + 2</text>

  <!-- Open interval (n - 1/2, n + 1/2): from 215 to 305 -->
  <line x1="215" y1="90" x2="305" y2="90" stroke="var(--accent)" stroke-width="4" stroke-linecap="round" />
  <circle cx="215" cy="90" r="4.5" fill="var(--paper)" stroke="var(--accent)" stroke-width="2" />
  <circle cx="305" cy="90" r="4.5" fill="var(--paper)" stroke="var(--accent)" stroke-width="2" />

  <!-- The isolated integer point n (Focal) -->
  <circle cx="260" cy="90" r="5.5" fill="var(--accent)" />
  <text x="260" y="125" class="fig-focus" text-anchor="middle">n</text>

  <!-- Labels for interval endpoints -->
  <text x="215" y="65" class="fig-tick" text-anchor="middle">n − ½</text>
  <text x="305" y="65" class="fig-tick" text-anchor="middle">n + ½</text>

  <!-- Singleton label -->
  <text x="260" y="35" class="fig-label" text-anchor="middle">{n}</text>
</svg>
