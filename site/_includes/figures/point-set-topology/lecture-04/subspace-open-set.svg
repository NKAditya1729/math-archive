<svg viewBox="0 0 540 260" role="img" aria-labelledby="fig-subspace-open-title"
     xmlns="http://www.w3.org/2000/svg" class="fig">
  <title id="fig-subspace-open-title">Subspace topology: an open set U in X intersects the subspace Y to produce the relative open set U ∩ Y in Y.</title>

  <!-- Ambient Space X -->
  <rect x="25" y="20" width="490" height="215" rx="10" stroke="var(--ink-soft)" stroke-width="1.5" stroke-dasharray="5 4" fill="none" />
  <text x="50" y="45" class="fig-label">X</text>

  <!-- Subspace Y (large ellipse) -->
  <ellipse cx="230" cy="130" rx="150" ry="80" stroke="var(--ink)" stroke-width="1.5" fill="var(--ink-soft)" fill-opacity="0.06" />
  <text x="130" y="90" class="fig-label">Y</text>

  <!-- Open set U in X -->
  <ellipse cx="320" cy="130" rx="90" ry="65" stroke="var(--ink-soft)" stroke-width="1.5" stroke-dasharray="4 3" fill="none" />
  <text x="385" y="95" class="fig-label">U</text>

  <!-- Relative open set U ∩ Y (Focal) -->
  <g clip-path="url(#y-clip)">
    <ellipse cx="320" cy="130" rx="90" ry="65" class="fig-region" />
  </g>

  <clipPath id="y-clip">
    <ellipse cx="230" cy="130" rx="150" ry="80" />
  </clipPath>

  <!-- Label for U ∩ Y -->
  <text x="275" y="135" class="fig-focus">U ∩ Y</text>
</svg>
