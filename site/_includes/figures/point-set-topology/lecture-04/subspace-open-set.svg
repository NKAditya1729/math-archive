<svg viewBox="0 0 540 260" role="img" aria-labelledby="fig-subspace-open-title"
     xmlns="http://www.w3.org/2000/svg" class="fig">
  <title id="fig-subspace-open-title">Subspace topology: an open set U in X intersects the subspace Y to produce the relative open set U ∩ Y in Y.</title>
  <style>
    .space-x { stroke: var(--ink-soft); stroke-width: 1.5; stroke-dasharray: 5 4; fill: none; }
    .space-y { stroke: var(--ink); stroke-width: 2; fill: var(--ink-soft); fill-opacity: 0.08; }
    .open-u { stroke: var(--accent-2, #3b6e8c); stroke-width: 1.5; stroke-dasharray: 4 3; fill: none; }
    .rel-open { stroke: var(--accent); stroke-width: 2.5; fill: var(--accent); fill-opacity: 0.25; }
    .label { font-family: 'Source Serif 4', Georgia, serif; font-size: 15px; fill: var(--ink); text-anchor: middle; }
    .label-italic { font-family: 'Source Serif 4', Georgia, serif; font-size: 15px; font-style: italic; fill: var(--ink); text-anchor: middle; }
    .label-accent { font-family: 'Source Serif 4', Georgia, serif; font-size: 15px; font-style: italic; fill: var(--accent); font-weight: 600; text-anchor: middle; }
    .label-u { font-family: 'Source Serif 4', Georgia, serif; font-size: 15px; font-style: italic; fill: var(--accent-2, #3b6e8c); font-weight: 600; text-anchor: middle; }
  </style>

  <!-- Background -->
  <rect width="540" height="260" fill="var(--paper)" />

  <!-- Ambient Space X -->
  <rect x="25" y="20" width="490" height="215" rx="10" class="space-x" />
  <text x="50" y="45" class="label-italic" style="font-weight: bold;">X</text>

  <!-- Subspace Y (large ellipse) -->
  <ellipse cx="230" cy="130" rx="150" ry="80" class="space-y" />
  <text x="130" y="90" class="label-italic" style="font-weight: bold;">Y</text>

  <!-- Open set U in X (shifted circle/ellipse) -->
  <ellipse cx="320" cy="130" rx="90" ry="65" class="open-u" />
  <text x="385" y="95" class="label-u">U ∈ τ</text>

  <!-- Relative open set U ∩ Y: we use clip-path or intersection path -->
  <g clip-path="url(#y-clip)">
    <ellipse cx="320" cy="130" rx="90" ry="65" class="rel-open" />
  </g>

  <clipPath id="y-clip">
    <ellipse cx="230" cy="130" rx="150" ry="80" />
  </clipPath>

  <!-- Label for U ∩ Y -->
  <text x="275" y="135" class="label-accent">U ∩ Y</text>
  <text x="270" y="220" class="label">Relative open set: U ∩ Y ∈ τ_Y</text>
</svg>
