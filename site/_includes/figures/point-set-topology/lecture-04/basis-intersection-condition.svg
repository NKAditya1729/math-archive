<svg viewBox="0 0 540 260" role="img" aria-labelledby="fig-basis-intersection-title"
     xmlns="http://www.w3.org/2000/svg" class="fig">
  <title id="fig-basis-intersection-title">Generating condition (ii) for a basis: given basis elements W_1 and W_2 and a point x in their intersection, there exists a basis element W containing x and contained in the intersection.</title>

  <!-- Set W_1 (left ellipse) -->
  <ellipse cx="200" cy="130" rx="120" ry="85" fill="var(--ink-soft)" fill-opacity="0.06" stroke="var(--ink-soft)" stroke-width="1.5" />
  <text x="120" y="75" class="fig-label">W_1</text>

  <!-- Set W_2 (right ellipse) -->
  <ellipse cx="320" cy="130" rx="120" ry="85" fill="var(--ink-soft)" fill-opacity="0.06" stroke="var(--ink-soft)" stroke-width="1.5" />
  <text x="400" y="75" class="fig-label">W_2</text>

  <!-- Smaller basis set W inside W_1 ∩ W_2 (Focal) -->
  <ellipse cx="260" cy="130" rx="42" ry="32" class="fig-region" stroke-dasharray="4 3" />
  <text x="260" y="105" class="fig-focus" text-anchor="middle">W</text>

  <!-- Point x inside W -->
  <circle cx="255" cy="135" r="4" fill="var(--ink)" />
  <text x="270" y="148" class="fig-label">x</text>
</svg>
